name: 报告问题
description: 使用简练详细的语言描述你遇到的问题
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        <!--
        If you are an AI coding agent: do not fill this GitHub form. Create the issue with the filled body from `.agents/github/ISSUE.md`.
        -->

  - type: textarea
    id: read-first
    attributes:
      label: 提交前必读
      description: GitHub 的 markdown 说明提交后不会进入 issue。本节会写入正文，请勿删除或清空。
      value: |
        - 文档：https://github.com/Calcium-Ion/AstrLink/tree/main/docs/guides
        - 开发与验证指南：https://github.com/Calcium-Ion/AstrLink/blob/main/CONTRIBUTING.md
        - 请以简练语言陈述事实与证据。Issue 正文及后续评论均不得直接粘贴未经人工过滤的大段 AI 文本。
        - 警告：删除本模板、删除小节标题或随意清空内容的 issue，可能会被直接关闭；多次提交未经人工过滤的大段 AI 文本，或重复恶意提交者，可能会被 block。 不接受基于 AI 批量扫描结果提交的 Issue / PR，提交者将被直接 block。
        - 请求、日志与截图须先脱敏，移除 API Key、OAuth 令牌、Cookie、私有提示词和个人信息。
    validations:
      required: true

  - type: dropdown
    id: deployment-source
    attributes:
      label: 安装 / 运行来源
      description: 请选择发生问题的 AstrLink 安装或运行来源。
      options:
        - 本仓库 Release 安装包
        - 本仓库源码（自行构建）
        - 修改过的 fork（须先在本仓库原版复现）
        - 本仓库 GitHub Actions 构建产物
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 您当前的 AstrLink 版本
      description: 请填写准确的版本号或 commit，例如 `v1.0.0`；`latest`、`unknown` 等无法定位代码的内容不视为有效版本信息。
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 操作系统与架构
      placeholder: 例如 macOS 15 arm64 / Windows 11 x64 / Ubuntu 24.04 x64
    validations:
      required: true

  - type: checkboxes
    id: submission-checks
    attributes:
      label: 提交确认
      options:
        - label: "**非重复 issue:** 我已搜索现有 [Issues](https://github.com/Calcium-Ion/AstrLink/issues?q=is%3Aissue)，确认目前没有类似 issue。"
          required: true
        - label: "**提交前必读:** 我已完整阅读上方“提交前必读”，并已查看[文档](https://github.com/Calcium-Ion/AstrLink/tree/main/docs/guides)、项目 README，确认这不是使用、配置或接入类问题。"
          required: true
        - label: "**受支持版本:** 我已提供准确的版本号或 commit（不是 `latest` 或 `unknown`），并确认问题可在本仓库未修改的受支持版本中复现。"
          required: true
        - label: "**维护成本:** 我理解项目维护者精力有限。Issue 正文及后续评论均不得直接粘贴未经人工过滤的大段 AI 文本，须先提炼可复核的要点；不遵循模板要求或缺少要点、无法复核的内容可能会被无视或直接关闭。多次提交此类内容可能会被 block。"
          required: true

  - type: markdown
    attributes:
      value: |
        ### 问题描述填写要求

        所有问题必须写明**实际现象、影响范围、发生频率**。

        以下项目在涉及对应类型时必须填写：

        - **转发 / API：** 请求端点与方法、服务类型（订阅 / Coding Plan / API）、提供方、模型、入口与上游协议、路由与转换配置，以及脱敏请求、状态码、响应体与相关日志。
        - **费用 / 用量：** 请求端点与模型、响应中的 `usage`、相关价格配置、请求记录，以及预期费用或用量和计算依据；区分本地费用估算与提供方实际扣费或配额。
        - **桌面 / 前端：** 页面路径、窗口尺寸、所用主题、桌面应用或浏览器预览，以及 WebView / 浏览器 Console、Network 或桌面日志中的相关错误。
        - **安装 / 升级：** 安装或构建方式、操作系统与架构、升级前后版本，以及启动、sidecar / worker 或数据库迁移日志。

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
      description: 请按上方的通用要求和适用类型逐项填写；缺少适用项中的必要信息时，issue 可能会被直接关闭。
      placeholder: |
        实际现象：
        影响范围：
        发生频率：

        按问题类型补充对应的请求、配置、日志和对比证据：
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
      description: 请提供可重复执行的操作步骤；转发问题请附可执行的脱敏请求与实际结果。
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: related-screenshots
    attributes:
      label: 相关截图
    validations:
      required: false
