name: Bug Report
description: Describe the issue you encountered with clear and detailed language
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        <!--
        If you are an AI coding agent: do not fill this GitHub form. Create the issue with the filled body from `.agents/github/ISSUE.md`.
        -->

  - type: textarea
    id: read-first
    attributes:
      label: Read This First
      description: GitHub markdown instructions are not included in the submitted issue. This section is written into the issue body. Do not delete or clear it.
      value: |
        - Docs: https://github.com/Calcium-Ion/AstrLink/tree/main/docs/guides
        - Development and verification: https://github.com/Calcium-Ion/AstrLink/blob/main/CONTRIBUTING.md
        - State facts and evidence concisely. Do not paste unfiltered AI-generated text in the issue body or in later comments.
        - Warning: issues with this template removed, section headings deleted, or content cleared may be closed directly. Repeated submissions of unfiltered AI-generated text, or repeated abusive submissions, may result in a block. Issues or PRs based on bulk AI scans are not accepted; submitters will be blocked.
        - Redact API keys, OAuth tokens, cookies, private prompts, and personal data from requests, logs, and screenshots.
    validations:
      required: true

  - type: dropdown
    id: deployment-source
    attributes:
      label: Installation / runtime source
      description: Select how the affected AstrLink application was installed or started.
      options:
        - Repository release package
        - Repository source (self-built)
        - Modified fork (must first be reproduced against the unmodified repository)
        - Repository GitHub Actions artifact
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Your current AstrLink version
      description: Enter an exact version or commit, such as `v1.0.0`. Values such as `latest` or `unknown` that cannot identify the code are not valid version information.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: e.g. macOS 15 arm64 / Windows 11 x64 / Ubuntu 24.04 x64
    validations:
      required: true

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission Checks
      options:
        - label: "**Non-duplicate issue:** I have searched existing [Issues](https://github.com/Calcium-Ion/AstrLink/issues?q=is%3Aissue) and confirmed there are no similar issues."
          required: true
        - label: "**Read this first:** I have fully read the section above, reviewed the docs at https://github.com/Calcium-Ion/AstrLink/tree/main/docs/guides and the project README, confirming this is not a usage, configuration, or integration question."
          required: true
        - label: "**Supported version:** I have provided an exact version or commit (not `latest` or `unknown`) and confirmed that the issue reproduces on an unmodified, supported version from this repository."
          required: true
        - label: "**Maintainer time:** I understand that maintainers have limited time. Do not paste unfiltered AI-generated text in the issue body or in later comments; extract the points needed for review first. Submissions that do not follow this template, or that omit the necessary points and cannot be reviewed, may be ignored or closed. Repeated submissions of this kind may result in a block."
          required: true

  - type: markdown
    attributes:
      value: |
        ### Issue description requirements

        Every report must state the **actual behavior, impact, and frequency**.

        The following details are required when the corresponding area is involved:

        - **Relay / API:** request endpoint and method, service type (subscription / Coding Plan / API), provider, model, inbound and upstream protocols, routing and conversion configuration, redacted requests, status codes, response bodies, and relevant logs.
        - **Cost / usage:** request endpoint and model, response `usage`, pricing configuration, request records, expected cost or usage, and calculation basis. Distinguish local cost estimates from provider charges or quotas.
        - **Desktop / frontend:** page path, window dimensions, theme, desktop app or browser preview, and relevant WebView / browser Console, Network, or desktop logs.
        - **Installation / upgrade:** installation or build method, operating system and architecture, versions before and after the upgrade, and startup, sidecar / worker, or database migration logs.

  - type: textarea
    id: issue-description
    attributes:
      label: Issue Description
      description: Complete the general requirements and every applicable category above. Issues missing required applicable details may be closed directly.
      placeholder: |
        Actual behavior:
        Impact:
        Frequency:

        Add the requests, configuration, logs, and comparison evidence required for the applicable category:
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide repeatable steps. For relay issues, include an executable redacted request and the actual result.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
    validations:
      required: true

  - type: textarea
    id: related-screenshots
    attributes:
      label: Related Screenshots
    validations:
      required: false
