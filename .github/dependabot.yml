# Keep SHA-pinned workflow actions and relaykit current. Other dependencies are
# covered by the vulnerability scans in CI instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a fresh release age before adopting it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    ignore:
      # Pinned to its untagged `stable` branch; bump the SHA by hand.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: gomod
    directory: /core
    schedule:
      # Check every day, including weekends, at 09:30 China Standard Time.
      interval: cron
      cronjob: "30 9 * * *"
      timezone: Asia/Shanghai
    allow:
      - dependency-name: github.com/QuantumNous/new-api/relaykit
        dependency-type: all
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
