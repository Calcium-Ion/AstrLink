name: Release macOS x86_64

# The Intel runner is the slowest release build. It runs beside Release
# instead of holding back the other platforms, and adds its package to the
# release once Release has published it.
on:
  push:
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: release-macos-x86_64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gate as Release: a valid tag, signing settings and a passing CI run.
  validate:
    if: github.repository == 'Calcium-Ion/AstrLink'
    runs-on: ubuntu-24.04
    # Waiting for the tagged commit's CI run can take about twenty minutes.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Validate tag and signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun apps/desktop/scripts/release-updates.mjs version "$RELEASE_TAG"
          bun apps/desktop/scripts/release-updates.mjs preflight
      - name: Require a passing CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/require-ci-success.sh

  macos:
    needs: validate
    uses: ./.github/workflows/macos-package.yml
    with:
      release_tag: ${{ github.ref_name }}
      arch: x86_64
    secrets: inherit

  publish:
    needs: macos
    runs-on: ubuntu-24.04
    # Release normally publishes before this build ends; otherwise wait for it.
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AstrLink-macOS-x86_64
          path: artifacts
      - name: Wait for Release to publish the other platforms
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: scripts/wait-for-release.sh
      - name: Verify the package and add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: bun apps/desktop/scripts/release-updates.mjs attach artifacts release "$RELEASE_TAG" darwin-x86_64
