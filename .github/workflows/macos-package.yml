name: macOS package

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRLINK_CI_NO_REMOTE_MODELS: "1"
  ASTRLINK_CI_SYNTHETIC_MODELS_ONLY: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
  MACOSX_DEPLOYMENT_TARGET: "13.4"

jobs:
  package:
    name: Build and verify macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_PROFILE: astrlink-notary
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Import Developer ID certificate and validate notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_NOTARY_KEYCHAIN: ${{ runner.temp }}/astrlink-signing.keychain-db
        run: |
          echo "APPLE_NOTARY_KEYCHAIN=$APPLE_NOTARY_KEYCHAIN" >> "$GITHUB_ENV"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8 APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Actions setting: $name"
              exit 1
            fi
          done
          [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application: "* ]] || {
            echo "::error::APPLE_SIGNING_IDENTITY must name a Developer ID Application certificate"
            exit 1
          }
          certificate_path="$RUNNER_TEMP/astrlink-signing.p12"
          api_key_path="$RUNNER_TEMP/astrlink-notary.p8"
          signing_probe="$RUNNER_TEMP/astrlink-signing-probe"
          trap 'rm -f "$certificate_path" "$api_key_path" "$signing_probe"' EXIT
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key_path"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$APPLE_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$APPLE_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$APPLE_NOTARY_KEYCHAIN"
          security import "$certificate_path" -k "$APPLE_NOTARY_KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$APPLE_NOTARY_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$APPLE_NOTARY_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$APPLE_NOTARY_KEYCHAIN"
          cp /usr/bin/true "$signing_probe"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$signing_probe"
          codesign --verify --strict \
            --test-requirement "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" \
            "$signing_probe"
          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE" \
            --keychain "$APPLE_NOTARY_KEYCHAIN" --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          echo "Developer ID private key and Apple notarization API credentials verified."
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            convo/go.mod
            contracts/go.mod
            contracts/go.sum
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Configure Bun cache
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: astrlink-native
          env-vars: ImageOS ImageVersion MACOSX_DEPLOYMENT_TARGET
          # Restore main's cache only; a release-profile cache on a tag ref is
          # unreachable from later tags and evicts main's entries.
          save-if: false
          workspaces: |
            apps/desktop/src-tauri
            apps/privacy-worker
            apps/classifier-worker
          cache-directories: apps/privacy-worker/target/onnxruntime
      - name: Check runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Stamp release version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun scripts/release-updates.mjs stamp "$RELEASE_TAG"
      - name: Validate update signing configuration
        if: inputs.release_tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun scripts/release-updates.mjs preflight
      - name: Check frontend and Core in parallel
        run: |
          (bun run branding:sync && bun run typecheck && bun run test) &
          frontend_pid=$!
          (cd ../../core && go test ./...) &
          core_pid=$!
          check_status=0
          wait "$frontend_pid" || check_status=1
          wait "$core_pid" || check_status=1
          exit "$check_status"
      - name: Reject production model artifacts
        run: bun ../../scripts/check-no-production-models.mjs
      - name: Stage Core and worker sidecars
        run: bun run sidecar:build
      - name: Build Developer ID signed app and DMG
        env:
          # With CI=true Tauri skips the Finder script that applies the DMG
          # background and icon positions.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: bun run tauri build --ci --bundles app,dmg
      - name: Notarize, staple and verify app and DMG
        run: bun run macos:notarize
      - name: Mount DMG and verify packaged application
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          mount_dir="$RUNNER_TEMP/astrlink-dmg"
          mkdir -p "$mount_dir"
          hdiutil verify "${images[0]}"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          bun ../../scripts/check-no-production-models.mjs --packaged "$mount_dir/AstrLink.app"
          python3 scripts/verify-unix-package.py \
            --platform macos --arch "$PACKAGE_ARCH" \
            --root "$mount_dir/AstrLink.app" \
            --logs "$RUNNER_TEMP/astrlink-smoke"
      - name: Prepare downloads and checksums
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p package
          cp src-tauri/target/release/bundle/dmg/*.dmg package/
          tar -czf "package/AstrLink-macOS-$PACKAGE_ARCH.app.tar.gz" \
            -C src-tauri/target/release/bundle/macos AstrLink.app
          cd package
          shasum -a 256 ./*.dmg ./*.tar.gz > SHA256SUMS
      - name: Sign and verify notarized update archive
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          update_arch="$PACKAGE_ARCH"
          if [[ "$update_arch" == arm64 ]]; then update_arch=aarch64; fi
          bun scripts/release-updates.mjs stage "darwin-$update_arch" "$RELEASE_TAG"
      - name: Upload checked macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AstrLink-macOS-${{ matrix.arch }}
          path: apps/desktop/package/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS-${{ matrix.arch }}-smoke-diagnostics
          path: ${{ runner.temp }}/astrlink-smoke/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload notarization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macOS-${{ matrix.arch }}-notarization
          path: apps/desktop/src-tauri/target/release/bundle/notarization/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -f "$APPLE_NOTARY_KEYCHAIN" ]]; then
            security delete-keychain "$APPLE_NOTARY_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/astrlink-signing.p12" "$RUNNER_TEMP/astrlink-notary.p8" "$RUNNER_TEMP/astrlink-signing-probe"
