name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRLINK_CI_BUILD_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
  ASTRLINK_CI_NO_REMOTE_MODELS: "1"
  ASTRLINK_CI_SYNTHETIC_MODELS_ONLY: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            convo/go.mod
            contracts/go.mod
            contracts/go.sum
      - name: Test Core
        run: go test ./...
      - name: Build Core
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        run: go build -trimpath -o astrlink-core${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/astrlink-core
      - name: Build MCP sidecar
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        run: go build -trimpath -o astrlink-mcp${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/astrlink-mcp
      - name: Archive Core executable
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true' && runner.os != 'Windows'
        run: tar -czf astrlink-core-${{ runner.arch }}.tar.gz astrlink-core -C .. LICENSE LICENSING.md LICENSES
      - name: Archive Core executable
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path astrlink-core.exe, ../LICENSE, ../LICENSING.md, ../LICENSES -DestinationPath astrlink-core-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v7
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        with:
          name: astrlink-core-${{ runner.os }}-${{ runner.arch }}
          path: |
            core/astrlink-core-*.tar.gz
            core/astrlink-core-*.zip
          if-no-files-found: error

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            convo/go.mod
            contracts/go.mod
            contracts/go.sum
      - name: Validate frozen contracts
        run: make contracts-check

  convo:
    name: Convo module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: convo/go.mod
          cache-dependency-path: convo/go.mod
      - name: Vet and test convo
        run: make convo-check
      - name: Assert convo has no third-party dependencies
        working-directory: convo
        run: |
          deps="$(go list -deps ./... | grep -E '^[^/]+\.[^/]+/' | grep -v '^github.com/QuantumNous/astrlink/convo' || true)"
          if [ -n "$deps" ]; then
            echo "convo must stay stdlib-only, found:"
            echo "$deps"
            exit 1
          fi

  go-race:
    name: Go race tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            convo/go.mod
            contracts/go.mod
            contracts/go.sum
      - name: Test Core, convo and contracts with race detector
        run: make -j3 core-race convo-race contracts-race

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-22.04,
            macos-latest,
            macos-15-intel,
            windows-latest,
          ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install frontend dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile
      - name: Reject production model artifacts
        run: bun ../../scripts/check-no-production-models.mjs
      - name: Check frontend
        run: bun run branding:sync && bun run typecheck && bun run test

  desktop-checks:
    name: Desktop checks
    needs: [core, contracts, convo, go-race, frontend, desktop]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to pass
        env:
          ALL_CHECKS_PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$ALL_CHECKS_PASSED" = true

  desktop:
    name: Desktop (${{ matrix.name }})
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.os, 'macos-') && '13.4' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            bundle: deb
          - name: macOS
            os: macos-latest
            bundle: app
          - name: macOS x64
            os: macos-15-intel
            bundle: app
          - name: Windows x64
            os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          binutils
          librsvg2-dev
          patchelf
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.mod
            core/go.sum
            convo/go.mod
            contracts/go.mod
            contracts/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bun-cache
          key: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/bun.lock') }}
          restore-keys: bun-packages-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: astrlink-native
          env-vars: ImageOS ImageVersion MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
          workspaces: |
            apps/desktop/src-tauri
            apps/privacy-worker
            apps/classifier-worker
          cache-directories: apps/privacy-worker/target/onnxruntime
      - name: Install frontend dependencies
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        run: bun install --frozen-lockfile
      - name: Build frontend
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        run: bun run build
      - name: Stage Core and worker sidecars
        # Tauri's Rust checks also require the configured sidecars and resources.
        run: bun run sidecar:build
      - name: Reject model artifacts from staged sidecars
        run: >-
          bun ../../scripts/check-no-production-models.mjs --packaged
          src-tauri/binaries
      - name: Reject model artifacts from frontend build
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        run: >-
          bun ../../scripts/check-no-production-models.mjs --packaged
          dist
      - name: Check privacy worker formatting
        run: cargo fmt --manifest-path ../privacy-worker/Cargo.toml --all -- --check
      - name: Lint privacy worker
        run: cargo clippy --locked --manifest-path ../privacy-worker/Cargo.toml --all-targets -- -D warnings
      - name: Test privacy worker
        run: cargo test --locked --manifest-path ../privacy-worker/Cargo.toml --all-targets
        env:
          ASTRLINK_CI_SYNTHETIC_MODELS_ONLY: "1"
      - name: Check classifier worker formatting
        run: cargo fmt --manifest-path ../classifier-worker/Cargo.toml --all -- --check
      - name: Lint classifier worker
        run: cargo clippy --locked --manifest-path ../classifier-worker/Cargo.toml --all-targets -- -D warnings
      - name: Test classifier worker
        run: cargo test --locked --manifest-path ../classifier-worker/Cargo.toml --all-targets
        env:
          ASTRLINK_CI_SYNTHETIC_MODELS_ONLY: "1"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust lifecycle
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build Tauri bundle
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        run: bun run tauri build --ci --bundles ${{ matrix.bundle }} --config '{"build":{"beforeBuildCommand":null}}'
      - name: Inspect packaged macOS application contents
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true' && runner.os == 'macOS'
        run: >-
          bun ../../scripts/check-no-production-models.mjs --packaged
          src-tauri/target/release/bundle/macos
      - name: Extract and inspect packaged Linux application contents
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          bundle_scan_dir="$RUNNER_TEMP/astrlink-bundle-scan"
          mkdir -p "$bundle_scan_dir"
          for archive in src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb -x "$archive" "$bundle_scan_dir"
            dependencies="$(dpkg-deb --field "$archive" Depends)"
            for dependency in 'libc6 (>= 2.36)' 'libstdc++6 (>= 12)' 'libgcc-s1'; do
              if [[ "$dependencies" != *"$dependency"* ]]; then
                echo "Missing model runtime package dependency: $dependency" >&2
                exit 1
              fi
            done
          done
          bun ../../scripts/check-no-production-models.mjs --packaged "$bundle_scan_dir"

          mapfile -t runtimes < <(
            find "$bundle_scan_dir" -type f \
              -path "*/onnxruntime/libonnxruntime.so.1.23.2" -print
          )
          if [[ "${#runtimes[@]}" -ne 1 ]]; then
            echo "Expected exactly one packaged Linux ONNX Runtime, found ${#runtimes[@]}." >&2
            exit 1
          fi

          worker="$bundle_scan_dir/usr/bin/astrlink-privacy-worker"
          classifier="$bundle_scan_dir/usr/bin/astrlink-classifier-worker"
          core="$bundle_scan_dir/usr/bin/astrlink-core"
          desktop="$bundle_scan_dir/usr/bin/astrlink-desktop"
          for executable in "$worker" "$classifier" "$core" "$desktop"; do
            if [[ ! -x "$executable" ]]; then
              echo "Missing packaged executable: $executable" >&2
              exit 1
            fi
          done

          if readelf -d "$worker" | grep -Fq "libonnxruntime"; then
            echo "Linux privacy worker must load ONNX Runtime dynamically." >&2
            exit 1
          fi
          if readelf -d "$classifier" | grep -Fq "libonnxruntime"; then
            echo "Linux classifier worker must load ONNX Runtime dynamically." >&2
            exit 1
          fi

          for executable in "$worker" "$classifier" "$core" "$desktop" "${runtimes[0]}"; do
            if ldd "$executable" 2>&1 | grep -F 'not found'; then
              echo "$executable has unresolved shared libraries." >&2
              exit 1
            fi
            maximum_glibcxx="$(
              readelf --version-info "$executable" |
                sed -n 's/.*Name: GLIBCXX_\([0-9][0-9.]*\).*/\1/p' |
                sort -V |
                tail -n 1
            )"
            if [[ -n "$maximum_glibcxx" && "$(printf '%s\n' "$maximum_glibcxx" "3.4.30" | sort -V | tail -n 1)" != "3.4.30" ]]; then
              echo "$executable requires GLIBCXX_$maximum_glibcxx, newer than Debian 12's libstdc++6." >&2
              exit 1
            fi
            maximum_glibc="$(
              readelf --version-info "$executable" |
                sed -n 's/.*Name: GLIBC_\([0-9][0-9.]*\).*/\1/p' |
                sort -V |
                tail -n 1
            )"
            if [[ -z "$maximum_glibc" ]]; then
              continue
            fi
            if [[ "$(printf '%s\n' "$maximum_glibc" "2.36" | sort -V | tail -n 1)" != "2.36" ]]; then
              echo "$executable requires GLIBC_$maximum_glibc, newer than Debian 12." >&2
              exit 1
            fi
          done
      - name: Extract and inspect packaged Windows application contents
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleScanDir = Join-Path $env:RUNNER_TEMP "astrlink-bundle-scan"
          New-Item -ItemType Directory -Force -Path $bundleScanDir | Out-Null
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            & 7z x $_.FullName "-o$bundleScanDir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect $($_.FullName)"
            }
          }
          $innerIndex = 0
          Get-ChildItem $bundleScanDir -Recurse -Filter "*.7z" | ForEach-Object {
            $innerDirectory = Join-Path $bundleScanDir "inner-$innerIndex"
            New-Item -ItemType Directory -Force -Path $innerDirectory | Out-Null
            & 7z x $_.FullName "-o$innerDirectory" -y | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect embedded archive $($_.FullName)"
            }
            $innerIndex += 1
          }
          bun ../../scripts/check-no-production-models.mjs --packaged $bundleScanDir
          $vcRuntime = Get-Content "scripts/windows-vc-runtime.json" -Raw | ConvertFrom-Json
          $redists = @(Get-ChildItem $bundleScanDir -Recurse -Filter "vc_redist.x64.exe")
          if ($redists.Count -ne 1) {
            throw "Expected one embedded offline Visual C++ x64 installer, found $($redists.Count)"
          }
          if ((Get-FileHash $redists[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $vcRuntime.sha256) {
            throw "Packaged Visual C++ runtime does not match the pinned payload"
          }
          $directML = @(Get-ChildItem $bundleScanDir -Recurse -Filter "DirectML.dll")
          if ($directML.Count -ne 1) {
            throw "Expected one packaged DirectML.dll, found $($directML.Count)"
          }
      - name: Archive macOS app with executable modes
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true' && runner.os == 'macOS'
        run: tar -czf astrlink-desktop-${{ runner.arch }}.tar.gz -C src-tauri/target/release/bundle/macos AstrLink.app
      - uses: actions/upload-artifact@v7
        if: env.ASTRLINK_CI_BUILD_ARTIFACTS == 'true'
        with:
          name: astrlink-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/astrlink-desktop-*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
