name: Docker image

on:
  push:
    branches: [main]
    # Version tags publish the image to Docker Hub, independently of release.yml.
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that may be pushing to Docker Hub.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ASTRLINK_CI_NO_REMOTE_MODELS: "1"
  # Set on tag refs: the image carries that version and is pushed.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  image:
    name: Server image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Stamp release version
        if: env.RELEASE_TAG != ''
        working-directory: apps/desktop
        run: bun scripts/release-updates.mjs stamp "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built natively on each runner and loaded for the tests; the push job
      # pushes the tested image, never a rebuild.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: astrlink:ci
          build-args: |
            ASTRLINK_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          # Tags restore main's cache only; a cache saved on a tag ref is
          # unreachable from later tags and evicts main's entries.
          cache-to: ${{ env.RELEASE_TAG == '' && format('type=gha,mode=max,scope=server-image-{0}', matrix.arch) || '' }}
      - name: Report image size
        run: docker image inspect astrlink:ci --format 'linux/${{ matrix.arch }} {{.Size}} bytes'
      - name: Smoke test
        run: scripts/docker-smoke-test.sh astrlink:ci
      - name: Check the image for production models
        run: |
          image_fs="$RUNNER_TEMP/image-fs"
          mkdir -p "$image_fs"
          container=$(docker create astrlink:ci)
          docker export "$container" | tar -x -C "$image_fs" --exclude='dev/*'
          docker rm "$container" >/dev/null
          bun scripts/check-no-production-models.mjs --packaged "$image_fs"
      - name: Export tested release image
        if: env.RELEASE_TAG != ''
        run: docker save --output "$RUNNER_TEMP/astrlink-${{ matrix.arch }}.tar" astrlink:ci
      - name: Upload tested release image
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/astrlink-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  push:
    name: Push to Docker Hub
    # This job holds the Docker Hub token, so it restores no caches and
    # rebuilds nothing: it pushes the images the image job tested.
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Calcium-Ion/AstrLink'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One push at a time, so tags pushed together cannot race for latest.
    concurrency:
      group: docker-hub-push
      cancel-in-progress: false
    env:
      IMAGE: docker.io/calciumion/astrlink
      STAGING: localhost:5000
    # A multi-arch manifest can only reference images already in a registry,
    # so the tested images pass through this local one first.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # 2.8.3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # latest depends on every version tag; only a full fetch brings
          # them all (a shallow fetch-tags gets the checked-out tag only).
          fetch-depth: 0
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: server-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Stage the tested images
        run: |
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/astrlink-$arch.tar"
            docker tag astrlink:ci "$STAGING/astrlink:$arch"
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$STAGING/astrlink:$arch")
            if [[ "$platform" != "linux/$arch" ]]; then
              echo "::error::astrlink-$arch.tar holds a $platform image"
              exit 1
            fi
            docker push "$STAGING/astrlink:$arch"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the multi-arch tags
        # latest and major.minor follow the desktop rule: they only move to
        # the highest stable version tag, overall or in that line.
        run: |
          tags=$(git tag --list | bun --eval '
            import { newestStable, releaseVersion } from "./apps/desktop/scripts/release-updates.mjs";
            const tag = process.env.RELEASE_TAG;
            const { version } = releaseVersion(tag);
            const line = version.split(".").slice(0, 2).join(".");
            const releases = (await Bun.stdin.text()).split("\n").filter(Boolean).map((tag_name) => ({ tag_name }));
            const inLine = releases.filter((r) => r.tag_name.replace(/^v/, "").startsWith(line + "."));
            // A Docker tag cannot hold the "+" of SemVer build metadata.
            console.log(version.replace("+", "_"));
            if (newestStable(tag, inLine)) console.log(line);
            if (newestStable(tag, releases)) console.log("latest");
          ')
          args=()
          for tag in $tags; do
            args+=(--tag "$IMAGE:$tag")
          done
          docker buildx imagetools create "${args[@]}" "$STAGING/astrlink:amd64" "$STAGING/astrlink:arm64"
          docker buildx imagetools inspect "${args[1]}"
