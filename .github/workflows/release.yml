name: Release

on:
  push:
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Calcium-Ion/AstrLink'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Validate tag and signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun apps/desktop/scripts/release-updates.mjs version "$RELEASE_TAG"
          bun apps/desktop/scripts/release-updates.mjs preflight

  macos:
    needs: validate
    uses: ./.github/workflows/macos-package.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  windows:
    needs: validate
    uses: ./.github/workflows/windows-package.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  linux:
    needs: validate
    uses: ./.github/workflows/linux-package.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Never restore a cached Bun binary into a job that holds release secrets.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AstrLink-*
          path: artifacts
      - name: Verify all platforms and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: bun apps/desktop/scripts/release-updates.mjs publish artifacts release "$RELEASE_TAG"
