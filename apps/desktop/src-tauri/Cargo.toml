[package]
name = "astrlink-desktop"
version = "0.1.0-dev.1"
description = "AstrLink desktop shell"
authors = ["AstrLink contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "astrlink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "=0.2.17"
iana-time-zone = "=0.1.65"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
toml_edit = "=0.22.22"
# macos-private-api: the tray popover is a transparent window with its own
# rounded panel; macOS only allows a transparent NSWindow through this flag.
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.5.0"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-shell = "=2.3.5"
tokio = { version = "=1.47.1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
mac-notification-sys = "=0.6.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", features = ["v3_24"] }
