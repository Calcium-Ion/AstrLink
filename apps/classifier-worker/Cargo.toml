[package]
name = "astrlink-classifier-worker"
version = "0.1.0-dev.1"
description = "Local sequence-classification inference worker for AstrLink auto routing"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
unicode-normalization = "=0.1.24"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "load-dynamic",
  "std",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "load-dynamic",
  "std",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "copy-dylibs",
  "download-binaries",
  "std",
  "tls-rustls",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
