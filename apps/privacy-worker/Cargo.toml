[package]
name = "astrlink-privacy-worker"
version = "0.1.0"
description = "Local privacy token-classification inference worker for AstrLink"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "load-dynamic",
  "std",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "load-dynamic",
  "std",
] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
  "copy-dylibs",
  "download-binaries",
  "std",
  "tls-rustls",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
