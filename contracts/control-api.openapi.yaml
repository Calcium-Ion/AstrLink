              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /control/v1/audit-settings:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Policies]
      operationId: getAuditSettings
      summary: Read the privileged global body-audit settings.
      description: M0 does not implement this planned operation. Both body switches default to false on installation and upgrade.
      responses:
        "200":
          description: Current audit settings. This response contains settings only, never captured content or encryption keys.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: ./protocol-capabilities.schema.json#/$defs/AuditSettings
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Policies]
      operationId: updateAuditSettings
      summary: Update the privileged global body-audit settings.
      description: |
        M0 does not implement this planned operation. Enabling request-body or
        response-content capture requires `audit_risk_acknowledged=true` in the
        same request. Disabling capture immediately stops new body records and does
        not delete existing encrypted records.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AuditSettingsPatch"
      responses:
        "200":
          description: Updated audit settings.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: ./protocol-capabilities.schema.json#/$defs/AuditSettings
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /control/v1/events:
    x-astrlink-implementation-status: planned
    get:
      tags: [Events]
      operationId: listEvents
      summary: List sanitized operational events.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/EventSeverity"
        - name: type
          in: query
          schema:
            type: string
            maxLength: 96
            pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$"
      responses:
        "200":
          description: Event page. Attributes are sanitized and never contain credentials or bodies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/requests:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Requests]
      operationId: listRequestRecords
      summary: List request metadata records.
      description: This operation never returns request or response body content.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: protocol
          in: query
          schema:
            $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        - name: service_id
          in: query
          schema:
            $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Request-record page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecordPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/requests/{request_id}:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      operationId: getRequestRecord
      summary: Read one request metadata record.
      responses:
        "200":
          description: Request metadata without body content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Requests]
      operationId: deleteRequestRecord
      summary: Delete one metadata record and its encrypted audit content, if any.
      responses:
        "204":
          description: Record and associated encrypted audit blobs deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/requests/{request_id}/audit:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      operationId: getRequestAuditContent
      summary: Decrypt and read explicitly captured audit content.
      description: |
        Available only through the authenticated local control plane. A null part
        means that direction was disabled or no content was captured. This response
        must not be logged, cached, included in diagnostics, or exported as ordinary
        configuration.
      responses:
        "200":
          description: Decrypted audit content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/requests/purge:
    x-astrlink-implementation-status: implemented
    post:
      tags: [Requests]
      operationId: purgeRequestRecords
      summary: Explicitly delete request records and associated encrypted audit content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRequest"
      responses:
        "200":
          description: Purge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-control-token
      description: Per-start local token delivered over protected IPC; never persist it in configuration or logs.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page. It must not be parsed by clients.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    From:
      name: from
      in: query
      description: Inclusive lower timestamp bound.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive upper timestamp bound.
      schema:
        type: string
        format: date-time
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    AccessTokenId:
      name: token_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET; prevents lost updates.
      schema:
        type: string
        minLength: 3
        maxLength: 128
  headers:
    NoStore:
      description: Sensitive local-control responses must not be cached.
      schema:
        type: string
        examples: [no-store]
    Location:
      description: Relative path of the created resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Strong entity tag for the current resource representation.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request, query, or cursor.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid local control token.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with current state or references.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: If-Match does not match the current resource representation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request is well-formed but violates a contract or safety invariant.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Local privacy policy or safety engine is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: The local privacy-model operation or persistent state failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Public model metadata could not be fetched or verified.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReadyEvent:
      type: object
      required:
        - event
        - core_version
        - control_api_version
        - protocol_contract_version
        - inference_url
        - control_url
      properties:
        event:
          type: string
          const: ready
        core_version:
          type: string
          minLength: 1
          maxLength: 64
        control_api_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        protocol_contract_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        inference_url:
          type: string
          format: uri
          pattern: "^http://127\\.0\\.0\\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?![\\s\\S])"
        control_url:
          type: string
          format: uri
          pattern: "^http://127\\.0\\.0\\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?![\\s\\S])"
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, starting]
      additionalProperties: false
    AccessToken:
      type: object
      required: [id, name, hint, source, created_at]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 64
        hint:
          type: string
          minLength: 1
          maxLength: 32
          description: Non-secret display hint that cannot be used to authenticate.
        source:
          type: string
          enum: [system_default, user]
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    AccessTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    AccessTokenSecret:
      type: object
      required: [token, access_token]
      properties:
        token:
          $ref: "#/components/schemas/AccessToken"
        access_token:
          type: string
          minLength: 48
          maxLength: 48
          pattern: "^astr_[A-Za-z0-9_-]{43}$"
      additionalProperties: false
    AccessTokenList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccessToken"
        next_cursor:
          type: "null"
          description: Reserved for a future paginated contract; v1 currently returns the complete bounded list.
      additionalProperties: false
    AccessTokenReveal:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          minLength: 48
          maxLength: 48
          pattern: "^astr_[A-Za-z0-9_-]{43}$"
      additionalProperties: false
    Version:
      type: object
      required:
        - core_version
        - control_api_version
        - protocol_contract_version
        - build_commit
      properties:
        core_version:
          type: string
          minLength: 1
          maxLength: 64
        control_api_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        protocol_contract_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        build_commit:
          type: string
          minLength: 7
          maxLength: 64
          pattern: "^(?:[0-9a-f]{7,64}|unknown)$"
      additionalProperties: false
    ServiceKind:
      type: string
      enum:
        - codex_subscription
        - newapi
        - openai
        - anthropic
        - gemini
        - openai_compatible
        - custom
      description: >
        Product-level service type. `codex_subscription` is browser-authorized;
        every other current value is an HTTP API service.
    HTTPServiceConnection:
      type: object
      required: [base_url, auth]
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://[^?#]+$"
          not:
            pattern: "^https?://[^/]*@"
          description: HTTP(S) origin or reverse-proxy path prefix without userinfo, query, or fragment.
        auth:
          $ref: ./protocol-capabilities.schema.json#/$defs/ServiceAuth
        credential_ref:
          type: string
          pattern: "^local://service/[a-z][a-z0-9_-]{2,95}$"
          readOnly: true
          description: Opaque local credential reference; never contains credential bytes.
      additionalProperties: false
    SubscriptionServiceConnection:
      type: object
      required: [provider, status]
      properties:
        provider:
          type: string
          enum: [openai_codex]
        status:
          type: string
          enum: [disconnected, authorizing, connected, needs_reauth, error]
        account_hint:
          type: string
          maxLength: 128
        provider_account_id:
          type: string
          maxLength: 256
        credential_ref:
          type: string
          maxLength: 512
          pattern: "^keyring://"
          readOnly: true
          description: Opaque keyring reference; OAuth token bytes never cross the control API.
        authorization_boundary:
          type: string
          maxLength: 240
        token_expires_at:
          type: string
          format: date-time
        last_refresh_at:
          type: string
          format: date-time
        last_error:
          $ref: "#/components/schemas/SubscriptionError"
      additionalProperties: false
    Service:
      type: object
      required: [id, name, kind, enabled, capabilities, created_at, updated_at]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: "#/components/schemas/ServiceKind"
        enabled:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ServiceCapability
        http:
          $ref: "#/components/schemas/HTTPServiceConnection"
        subscription:
          $ref: "#/components/schemas/SubscriptionServiceConnection"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
      oneOf:
        - properties:
            kind:
              const: codex_subscription
          required: [subscription]
          not:
            required: [http]
        - properties:
            kind:
              $ref: ./protocol-capabilities.schema.json#/$defs/HTTPServiceKind
          required: [http]
          not:
            required: [subscription]
    HTTPServiceConnectionInput:
      type: object
      required: [base_url, auth]
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://[^?#]+$"
          not:
            pattern: "^https?://[^/]*@"
        auth:
          $ref: ./protocol-capabilities.schema.json#/$defs/ServiceAuth
        credential:
          $ref: "#/components/schemas/CredentialInput"
      additionalProperties: false
    ServiceCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: "#/components/schemas/ServiceKind"
        enabled:
          type: boolean
          default: true
        http:
          $ref: "#/components/schemas/HTTPServiceConnectionInput"
        capabilities:
          type: array
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ServiceCapability
      additionalProperties: false
      oneOf:
        - properties:
            kind:
              const: codex_subscription
          not:
            anyOf:
              - required: [http]
              - required: [capabilities]
        - properties:
            kind:
              $ref: ./protocol-capabilities.schema.json#/$defs/HTTPServiceKind
          required: [http, capabilities]
    HTTPServiceConnectionPatch:
      type: object
      minProperties: 1
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://[^?#]+$"
          not:
            pattern: "^https?://[^/]*@"
        auth:
          $ref: ./protocol-capabilities.schema.json#/$defs/ServiceAuth
        credential:
          oneOf:
            - $ref: "#/components/schemas/CredentialInput"
            - type: "null"
              description: Remove the stored HTTP credential.
      additionalProperties: false
    ServicePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        http:
          $ref: "#/components/schemas/HTTPServiceConnectionPatch"
        capabilities:
          type: array
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ServiceCapability
      additionalProperties: false
    CredentialInput:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Stored through CredentialStore and never returned or logged.
      additionalProperties: false
    AstrLinkAutoModel:
      type: string
      const: astrlink/auto
      description: >
        Reserved public virtual-model identifier. It is never an ordinary
        alias: requests using this exact model require a Route whose
        selection.mode is auto.
    RouteSelectionMode:
      type: string
      enum: [priority, auto]
      description: >
        priority chooses targets in deterministic target-priority order. auto
        applies hard capability constraints, classifies the bounded request into
        one category in a versioned taxonomy, keeps the targets configured under
        that category_id, and then uses target priority as the deterministic
        selection and fallback order. The classifier never predicts a target or
        upstream model identifier.
    RouteSelection:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/RouteSelectionMode"
        taxonomy_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{0,63}$'
          example: astrlink-text-v1
          description: >
            Versioned task-classification taxonomy used by auto selection.
            Required when mode is auto and forbidden when mode is priority.
            It identifies label semantics, not a classifier implementation.
      allOf:
        - if:
            properties:
              mode:
                const: auto
            required: [mode]
          then:
            required: [taxonomy_id]
          else:
            not:
              required: [taxonomy_id]
      additionalProperties: false
      description: >
        Optional target-selection strategy. Omission is exactly equivalent to
        mode priority, preserving existing Route behavior. Mode auto requires
        match.model to equal astrlink/auto and replaces the ordinary top-level
        targets array with at least two RouteCategory objects. Every category
        owns one or more targets, every target has a concrete upstream_model,
        and the complete Route contains at least two distinct upstream model
        names. The taxonomy ID and category-owned model pools are stable
        configuration; classifier weights, confidence values, and model-ranking
        predictions are not.
    Route:
      type: object
      required:
        - id
        - name
        - enabled
        - priority
        - match
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        match:
          $ref: "#/components/schemas/RouteMatch"
        selection:
          $ref: "#/components/schemas/RouteSelection"
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTarget"
        categories:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RouteCategory"
      allOf:
        - if:
            properties:
              selection:
                properties:
                  mode:
                    const: auto
                required: [mode]
            required: [selection]
          then:
            required: [categories]
            properties:
              match:
                properties:
                  model:
                    $ref: "#/components/schemas/AstrLinkAutoModel"
                required: [model]
            not:
              required: [targets]
          else:
            required: [targets]
            properties:
              match:
                not:
                  properties:
                    model:
                      $ref: "#/components/schemas/AstrLinkAutoModel"
                  required: [model]
            not:
              required: [categories]
      additionalProperties: false
    RouteCreate:
      type: object
      required: [name, priority, match]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        match:
          $ref: "#/components/schemas/RouteMatch"
        selection:
          $ref: "#/components/schemas/RouteSelection"
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTarget"
        categories:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RouteCategory"
      allOf:
        - if:
            properties:
              selection:
                properties:
                  mode:
                    const: auto
                required: [mode]
            required: [selection]
          then:
            required: [categories]
            properties:
              match:
                properties:
                  model:
                    $ref: "#/components/schemas/AstrLinkAutoModel"
                required: [model]
            not:
              required: [targets]
          else:
            required: [targets]
            properties:
              match:
                not:
                  properties:
                    model:
                      $ref: "#/components/schemas/AstrLinkAutoModel"
                  required: [model]
            not:
              required: [categories]
      additionalProperties: false
    RoutePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        match:
          $ref: "#/components/schemas/RouteMatch"
        selection:
          oneOf:
            - $ref: "#/components/schemas/RouteSelection"
            - type: "null"
              description: Restore the backward-compatible priority selection mode.
        targets:
          oneOf:
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/RouteTarget"
            - type: "null"
              description: Remove top-level priority targets when switching to auto.
        categories:
          oneOf:
            - type: array
              minItems: 2
              items:
                $ref: "#/components/schemas/RouteCategory"
            - type: "null"
              description: Remove category pools when switching to priority.
          description: >
            After applying a merge patch, the resulting Route must satisfy the
            priority/auto conditional shape and full cross-field validation.
      additionalProperties: false
    RouteMatch:
      type: object
      required: [protocol]
      properties:
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        model:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            Exact public model or alias. Omission matches any model.
            astrlink/auto is reserved and is valid only with
            selection.mode=auto.
      additionalProperties: false
    RouteTarget:
      type: object
      required:
        - service_id
        - plan_type
        - upstream_protocol
        - priority
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        plan_type:
          $ref: ./protocol-capabilities.schema.json#/$defs/PlanType
          description: RelayKit is a stable future value but is rejected while capabilities report it unavailable in Alpha.
        upstream_protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        upstream_model:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            Rewrite the public model to this upstream model for this target.
            Requires a non-empty match.model on the route. Omission preserves
            the public model bytes. Every auto-selection target requires this
            field; target priority remains its deterministic low-confidence and
            transport-failure fallback order.
      additionalProperties: false
    RouteCategory:
      type: object
      required: [category_id, targets]
      properties:
        category_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{0,63}$'
          description: >
            One classifier output from selection.taxonomy_id. Category IDs are
            supplied by AstrLink's versioned taxonomy, not inferred from model
            names.
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTarget"
          description: >
            Ordered concrete model candidates configured under this category.
            Multiple models are allowed and target priority determines the
            category-local selection and transport-fallback order. The same
            concrete model may appear in another category explicitly.
      additionalProperties: false
    Policy:
      type: object
      required:
        - id
        - name
        - enabled
        - priority
        - detector
        - local_model_id
        - min_confidence
        - match
        - request_action
        - response_action
        - response_restore
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        detector:
          $ref: "#/components/schemas/PolicyDetector"
        local_model_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelInstallationId"
            - type: "null"
          description: Required to reference a ready installation when detector is local_model; null for regex.
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
          description: >
            Inclusive confidence threshold for local-model findings. Candidates
            below this value are suppressed before the request action is chosen.
            Regex findings do not use this threshold.
        match:
          $ref: "#/components/schemas/PolicyMatch"
        request_action:
          $ref: "#/components/schemas/PolicyAction"
        response_action:
          type: string
          const: allow
          readOnly: true
        response_restore:
          type: boolean
          default: true
          description: >
            When request_action is redact, restore this request's placeholders in
            the upstream response before returning to the client. Default true.
      additionalProperties: false
    PolicyCreate:
      type: object
      required: [name, priority, detector, match, request_action]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        detector:
          $ref: "#/components/schemas/PolicyDetector"
        local_model_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelInstallationId"
            - type: "null"
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        match:
          $ref: "#/components/schemas/PolicyMatch"
        request_action:
          $ref: "#/components/schemas/PolicyAction"
        response_restore:
          type: boolean
          default: true
      additionalProperties: false
    PolicyPatch:
      type: object
      minProperties: 1
      properties:
        enabled:
          type: boolean
        detector:
          $ref: "#/components/schemas/PolicyDetector"
        local_model_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelInstallationId"
            - type: "null"
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
        request_action:
          $ref: "#/components/schemas/PolicyAction"
        response_restore:
          type: boolean
      additionalProperties: false
    PolicyDryRunRequest:
      type: object
      required: [protocol, sample_text]
      properties:
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
          description: Must be a protocol with inspectable request-body roots.
        sample_text:
          type: string
          minLength: 1
          maxLength: 262144
        policy:
          $ref: "#/components/schemas/PolicyPatch"
          description: Optional patchable overrides applied only for this evaluation.
      additionalProperties: false
    PolicyDryRunFinding:
      type: object
      required: [kind, path, start, end, confidence]
      description: >
        Matched span metadata only. Never includes matched plaintext; sample
        plaintext for placeholders appears solely on redactions for local dry-run.
      properties:
        kind:
          $ref: "#/components/schemas/PrivacyCanonicalKind"
        path:
          type: string
          minLength: 1
          description: JSON Pointer path of the inspected string segment.
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Detector confidence retained from the local worker; Regex findings use 1.
      additionalProperties: false
    PolicyDryRunRedaction:
      type: object
      required: [placeholder, kind, value]
      properties:
        placeholder:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/PrivacyCanonicalKind"
        value:
          type: string
          description: Original sample text for this placeholder; dry-run only.
      additionalProperties: false
    PolicyDryRunResponse:
      type: object
      required: [decision, findings_summary, findings, suppressed_findings, inspected_body]
      properties:
        decision:
          $ref: "#/components/schemas/PolicyAction"
        findings_summary:
          type: string
          description: Stable kind=count summary; never includes matched plaintext.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDryRunFinding"
          description: Findings that passed the configured threshold and drive the decision.
        suppressed_findings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDryRunFinding"
          description: Local-model candidates rejected for being below min_confidence.
        redactions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDryRunRedaction"
          description: Placeholder-to-sample mapping for local preview; never used on the live inference plane.
        redacted_body:
          type: string
          description: Present only when decision is redact.
        inspected_body:
          type: string
          description: Minimal request JSON that was actually inspected.
      additionalProperties: false
    PolicyMatch:
      type: object
      properties:
        protocols:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
          description: Empty means all protocols.
        models:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: Empty means all public models and aliases.
        service_ids:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
          description: Empty means all services.
      additionalProperties: false
    PolicyAction:
      type: string
      enum: [allow, warn, block, redact]
    PolicyDetector:
      type: string
      enum: [regex, local_model]
    PrivacyModelAdapter:
      type: string
      enum: [openai_bioes_viterbi, hf_token_classification]
    PrivacyModelInstallationId:
      type: string
      pattern: "^model_[0-9a-f]{32}$"
    PrivacyModelCatalogId:
      type: string
      pattern: "^catalog_[a-z0-9_]{3,80}$"
    PrivacyCanonicalKind:
      type: string
      enum:
        - email
        - phone
        - account
        - payment_card
        - ip_address
        - url
        - common_secret
        - private_address
        - private_date
        - private_person
    PrivacyModelVariant:
      type: object
      required:
        - id
        - name
        - quantization
        - bytes_total
        - estimated_ram_bytes
        - recommended
        - supported
        - unsupported_reason
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed display name; control characters are not allowed.
        quantization:
          type: string
          minLength: 1
          maxLength: 32
          description: Trimmed quantization identifier; control characters are not allowed.
        bytes_total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        estimated_ram_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        recommended:
          type: boolean
        supported:
          type: boolean
        unsupported_reason:
          oneOf:
            - type: string
              enum: [cpu_only]
            - type: "null"
      additionalProperties: false
    PrivacyModelCatalogItem:
      type: object
      required:
        - id
        - name
        - summary
        - source
        - repo_id
        - revision
        - license
        - languages
        - adapter
        - variants
      properties:
        id:
          $ref: "#/components/schemas/PrivacyModelCatalogId"
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed model display name; control characters are not allowed.
        summary:
          type: string
          minLength: 1
          maxLength: 512
        source:
          type: string
          enum: [official, community]
        repo_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$"
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
        license:
          type: string
          minLength: 1
          maxLength: 64
        languages:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        adapter:
          $ref: "#/components/schemas/PrivacyModelAdapter"
        variants:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PrivacyModelVariant"
      additionalProperties: false
    PrivacyModelCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PrivacyModelCatalogItem"
      additionalProperties: false
    PrivacyModelProbeRequest:
      type: object
      required: [repo_id, revision]
      properties:
        repo_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$"
        revision:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
      additionalProperties: false
    PrivacyModelProbeLabel:
      type: object
      required: [label, suggested_kind]
      properties:
        label:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"
        suggested_kind:
          oneOf:
            - $ref: "#/components/schemas/PrivacyCanonicalKind"
            - type: "null"
      additionalProperties: false
    PrivacyModelProbe:
      type: object
      required:
        - repo_id
        - requested_revision
        - revision
        - name
        - license
        - languages
        - adapter
        - variants
        - labels
        - requires_label_mapping
      properties:
        repo_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$"
        requested_revision:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$"
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed model display name; control characters are not allowed.
        license:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: "null"
        languages:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        adapter:
          $ref: "#/components/schemas/PrivacyModelAdapter"
        variants:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/PrivacyModelVariant"
        labels:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/PrivacyModelProbeLabel"
        requires_label_mapping:
          type: boolean
      additionalProperties: false
    PrivacyModelLabelMapping:
      type: object
      maxProperties: 256
      propertyNames:
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/PrivacyCanonicalKind"
          - type: "null"
    PrivacyModelInstallRequest:
      type: object
      required: [repo_id, revision, variant_id, label_mapping]
      properties:
        repo_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$"
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
        variant_id:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        label_mapping:
          $ref: "#/components/schemas/PrivacyModelLabelMapping"
      additionalProperties: false
    PrivacyModelInstallation:
      type: object
      required:
        - id
        - source
        - catalog_id
        - catalog_source
        - name
        - license
        - languages
        - repo_id
        - revision
        - variant_id
        - variant_name
        - quantization
        - adapter
        - status
        - bytes_downloaded
        - bytes_total
        - estimated_ram_bytes
        - error
        - label_mapping
        - installed_at
      properties:
        id:
          $ref: "#/components/schemas/PrivacyModelInstallationId"
        source:
          type: string
          enum: [catalog, custom]
        catalog_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelCatalogId"
            - type: "null"
        catalog_source:
          oneOf:
            - type: string
              enum: [official, community]
            - type: "null"
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed model display name; control characters are not allowed.
        license:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: "null"
        languages:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        repo_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,95}/[A-Za-z0-9][A-Za-z0-9._-]{0,95}$"
        revision:
          type: string
          pattern: "^[0-9a-f]{40}$"
        variant_id:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        variant_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed variant display name; control characters are not allowed.
        quantization:
          type: string
          minLength: 1
          maxLength: 32
          description: Trimmed quantization identifier; control characters are not allowed.
        adapter:
          $ref: "#/components/schemas/PrivacyModelAdapter"
        status:
          type: string
          enum: [downloading, ready, error]
        bytes_downloaded:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        bytes_total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        estimated_ram_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        error:
          oneOf:
            - type: string
              enum: [download_failed, integrity_failed, incompatible_model]
            - type: "null"
        label_mapping:
          $ref: "#/components/schemas/PrivacyModelLabelMapping"
        installed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      additionalProperties: false
    PrivacyModelInstallationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PrivacyModelInstallation"
      additionalProperties: false
    AuditSettingsPatch:
      type: object
      minProperties: 1
      properties:
        request_body_enabled:
          type: boolean
        response_content_enabled:
          type: boolean
        http_meta_enabled:
          type: boolean
        request_body_max_bytes:
          type: integer
          minimum: 1024
          maximum: 16777216
        response_content_max_bytes:
          type: integer
          minimum: 1024
          maximum: 67108864
        metadata_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        content_retention_days:
          type: integer
          minimum: 1
          maximum: 365
        audit_risk_acknowledged:
          type: boolean
          writeOnly: true
          description: Must be true when enabling either capture switch; the acknowledgement is not persisted.
        extensions:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/Extensions
            - type: "null"
          description: Namespaced extensions to replace, or null to delete them under RFC 7386 merge-patch semantics.
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/AuditAcknowledgementInvariant"
    AuditAcknowledgementInvariant:
      if:
        anyOf:
          - required: [request_body_enabled]
            properties:
              request_body_enabled:
                const: true
          - required: [response_content_enabled]
            properties:
              response_content_enabled:
                const: true
      then:
        required: [audit_risk_acknowledged]
        properties:
          audit_risk_acknowledged:
            const: true
    EventSeverity:
      type: string
      enum: [debug, info, warning, error, critical]
    Event:
      type: object
      required: [id, occurred_at, type, severity, summary, subject, attributes]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        occurred_at:
          type: string
          format: date-time
        type:
          type: string
          minLength: 3
          maxLength: 96
          pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$"
          examples: [service.health_changed, core.started, policy.blocked]
        severity:
          $ref: "#/components/schemas/EventSeverity"
        summary:
          type: string
          minLength: 1
          maxLength: 512
          description: Sanitized human-readable text without upstream URLs, IPs, credentials, or body content.
        subject:
          $ref: "#/components/schemas/EventSubject"
        attributes:
          $ref: "#/components/schemas/SanitizedAttributes"
      additionalProperties: false
    EventSubject:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [core, service, route, policy, request]
        id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
      additionalProperties: false
    SanitizedAttributes:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 512
          - type: number
          - type: boolean
          - type: "null"
      description: Bounded scalar metadata only. Bodies, headers, credentials, URLs with userinfo, and unsanitized upstream errors are forbidden.
    RequestStatus:
      type: string
      enum: [pending, succeeded, failed, cancelled, blocked]
    RequestRecord:
      type: object
      required:
        - id
        - started_at
        - completed_at
        - status
        - input_protocol
        - requested_model
        - streaming
        - route_id
        - service_id
        - local_access_token_id
        - plan
        - http_status
        - latency_ms
        - usage
        - error
        - audit
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/RequestStatus"
        input_protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        requested_model:
          type: [string, "null"]
          maxLength: 256
        streaming:
          type: boolean
        route_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
        service_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
        local_access_token_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
          description: Stable local access-token attribution. The historical identifier remains after the token is deleted.
        plan:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ExecutionPlan
            - type: "null"
        http_status:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
        latency_ms:
          type: [integer, "null"]
          minimum: 0
        usage:
          oneOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
        audit:
          $ref: "#/components/schemas/AuditRecordSummary"
        extensions:
          $ref: ./protocol-capabilities.schema.json#/$defs/Extensions
      additionalProperties: false
    Usage:
      type: object
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
      additionalProperties: false
    ErrorSummary:
      type: object
      required: [category, code, message, retryable]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
        code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: Sanitized message without service identity, URL, IP, organization, project, headers, or body content.
        retryable:
          type: boolean
      additionalProperties: false
    AuditRecordSummary:
      type: object
      required:
        - request_body_captured
        - response_content_captured
        - request_body_truncated
        - response_content_truncated
      properties:
        request_body_captured:
          type: boolean
        response_content_captured:
          type: boolean
        request_body_truncated:
          type: boolean
        response_content_truncated:
          type: boolean
      additionalProperties: false
    AuditContent:
      type: object
      required: [request_id, http_meta, request_body, response_content]
      properties:
        request_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        http_meta:
          oneOf:
            - $ref: "#/components/schemas/AuditHTTPMeta"
            - type: "null"
          description: Redacted HTTP envelope (ADR 0008); null when http_meta capture was disabled or the record predates it.
        request_body:
          oneOf:
            - $ref: "#/components/schemas/AuditContentPart"
            - type: "null"
        response_content:
          oneOf:
            - $ref: "#/components/schemas/AuditContentPart"
            - type: "null"
      additionalProperties: false
    AuditHeader:
      type: object
      required: [name, value, redacted]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        value:
          type: string
          maxLength: 2048
          description: Redacted entries carry a masked placeholder, never the original bytes.
        redacted:
          type: boolean
      additionalProperties: false
    AuditHTTPMeta:
      type: object
      required: [method, url, http_version, request_headers, response_status, response_headers]
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 32
        url:
          type: string
          maxLength: 4096
          description: Userinfo stripped and sensitive query parameter values masked at capture time.
        http_version:
          type: string
          maxLength: 16
        request_headers:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/AuditHeader"
        response_status:
          oneOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: "null"
        response_headers:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/AuditHeader"
      additionalProperties: false
    AuditContentPart:
      type: object
      required: [media_type, content, truncated, captured_bytes]
      properties:
        media_type:
          type: string
          minLength: 1
          maxLength: 128
        content:
          type: string
          description: Decrypted content; never log, cache, diagnose, or include in ordinary exports.
        truncated:
          type: boolean
        captured_bytes:
          type: integer
          minimum: 0
      additionalProperties: false
    PurgeRequest:
      type: object
      required: [scope, confirm]
      properties:
        scope:
          type: string
          enum: [all, before]
        before:
          type: string
          format: date-time
          description: Required when scope is before.
        confirm:
          type: boolean
          const: true
          description: Explicit destructive-action confirmation.
      additionalProperties: false
      allOf:
        - if:
            properties:
              scope:
                const: before
            required: [scope]
          then:
            required: [before]
        - if:
            properties:
              scope:
                const: all
            required: [scope]
          then:
            not:
              required: [before]
    PurgeResult:
      type: object
      required: [deleted_records, deleted_audit_blobs]
      properties:
        deleted_records:
          type: integer
          minimum: 0
        deleted_audit_blobs:
          type: integer
          minimum: 0
      additionalProperties: false
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    RoutePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    PolicyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/Policy"
        next_cursor:
          type: "null"
      additionalProperties: false
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    RequestRecordPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestRecord"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/ControlError"
        request_id:
          type: string
          minLength: 1
          maxLength: 96
      additionalProperties: false
    ControlError:
      type: object
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
          examples: [missing_protocol_capability, validation_failed]
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: Sanitized user-facing message.
        retryable:
          type: boolean
        details:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          maxLength: 256
        reason:
          type: string
          maxLength: 512
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        required_plan_types:
          type: array
          uniqueItems: true
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/PlanType
      additionalProperties: false
    SubscriptionError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        message:
          type: string
          minLength: 1
          maxLength: 240
      additionalProperties: false
    AuthorizationFlow:
      type: string
      enum: [browser, device_code]
    AuthorizationStartRequest:
      type: object
      required: [flow]
      properties:
        flow:
          $ref: "#/components/schemas/AuthorizationFlow"
      additionalProperties: false
    AuthorizationDeviceCode:
      type: object
      required: [verification_url, user_code]
      properties:
        verification_url:
          type: string
          maxLength: 4096
        user_code:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    AuthorizationSession:
      type: object
      required: [id, provider, status, flow, service_id, expires_at, created_at, updated_at]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        provider:
          type: string
          enum: [openai_codex]
        status:
          type: string
          enum: [pending, completed, cancelled, expired, failed]
        flow:
          $ref: "#/components/schemas/AuthorizationFlow"
        authorization_url:
          type: string
          maxLength: 4096
        device_code:
          $ref: "#/components/schemas/AuthorizationDeviceCode"
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        expires_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/SubscriptionError"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              status:
                const: pending
              flow:
                const: browser
            required: [status, flow]
          then:
            required: [authorization_url]
            not:
              required: [device_code]
        - if:
            properties:
              status:
                const: pending
              flow:
                const: device_code
            required: [status, flow]
          then:
            required: [device_code]
            not:
              required: [authorization_url]
        - if:
            properties:
              status:
                enum: [completed, cancelled, expired, failed]
            required: [status]
          then:
            not:
              anyOf:
                - required: [authorization_url]
                - required: [device_code]
      additionalProperties: false
    ServiceModelProbe:
      type: object
      required: [service_id, model_ids]
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        model_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
      additionalProperties: false
    ServiceResponsesProbe:
      type: object
      required: [service_id, status_code, ok]
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        status_code:
          type: integer
          minimum: 100
          maximum: 599
        ok:
          type: boolean
        response_id:
          type: string
          maxLength: 256
      additionalProperties: false
