            const: true
    EventSeverity:
      type: string
      enum: [debug, info, warning, error, critical]
    Event:
      type: object
      required: [id, occurred_at, type, severity, summary, subject, attributes]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        occurred_at:
          type: string
          format: date-time
        type:
          type: string
          minLength: 3
          maxLength: 96
          pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$"
          examples: [service.health_changed, core.started, policy.blocked]
        severity:
          $ref: "#/components/schemas/EventSeverity"
        summary:
          type: string
          minLength: 1
          maxLength: 512
          description: Sanitized human-readable text without upstream URLs, IPs, credentials, or body content.
        subject:
          $ref: "#/components/schemas/EventSubject"
        attributes:
          $ref: "#/components/schemas/SanitizedAttributes"
      additionalProperties: false
    EventSubject:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [core, service, route, policy, request]
        id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
      additionalProperties: false
    SanitizedAttributes:
      type: object
      maxProperties: 32
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 512
          - type: number
          - type: boolean
          - type: "null"
      description: Bounded scalar metadata only. Bodies, headers, credentials, URLs with userinfo, and unsanitized upstream errors are forbidden.
    RequestStatus:
      type: string
      enum: [pending, succeeded, failed, cancelled, blocked]
    SessionStatus:
      type: string
      enum: [pending, succeeded, failed, cancelled, blocked, interrupted]
      description: >
        Outcome of a whole conversation, taken from its last call. interrupted
        has no record-level counterpart: the conversation delivered at least
        one successful answer and then the client abandoned the last stream,
        so a stopped agent loop is not reported as if nothing had run.
        cancelled is kept for a conversation that produced nothing.
    RequestRecord:
      type: object
      required:
        - id
        - parent_request_id
        - attempt_index
        - child_count
        - started_at
        - completed_at
        - status
        - input_protocol
        - requested_model
        - streaming
        - route_id
        - service_id
        - local_access_token_id
        - plan
        - http_status
        - latency_ms
        - usage
        - error
        - audit
        - privacy_restore
        - session_id
        - previous_response_id
        - output_response_id
        - input_preview
        - events
      properties:
        recovery:
          $ref: "#/components/schemas/RequestRecovery"
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        parent_request_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
          description: |
            Null for the final upstream attempt (list root). Set to the root id for
            earlier failed retry attempts demoted to independent child records.
        attempt_index:
          type: integer
          minimum: 0
          description: |
            1-based index over real upstream RoundTrip attempts. 0 means the request
            never reached upstream (local blocked/failed). Legacy rows migrate as 1.
        child_count:
          type: integer
          minimum: 0
          description: Derived count of demoted retry children under a root; always 0 for children.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/RequestStatus"
        input_protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        requested_model:
          type: [string, "null"]
          maxLength: 256
          description: Model name sent by the client, before any model redirect.
        model_redirect:
          $ref: "#/components/schemas/RequestModelRedirect"
        reasoning_effort:
          type: [string, "null"]
          minLength: 1
          maxLength: 32
          description: Explicit client-requested reasoning level, normalized to lowercase. Null for unspecified levels and historical records; never inferred from model names or token budgets.
        streaming:
          type: boolean
        route_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
        service_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
        local_access_token_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
          description: Stable local access-token attribution. The historical identifier remains after the token is deleted.
        plan:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ExecutionPlan
            - type: "null"
        http_status:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
        latency_ms:
          type: [integer, "null"]
          minimum: 0
        usage:
          oneOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
        audit:
          $ref: "#/components/schemas/AuditRecordSummary"
        privacy_restore:
          oneOf:
            - $ref: "#/components/schemas/PrivacyRestoreSummary"
            - type: "null"
          description: Non-sensitive request-scoped placeholder restoration diagnostics; null for legacy records and requests without redactions.
        session_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
          description: Conversation session this root belongs to. Null on legacy rows.
        previous_response_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          description: Inbound protocol cursor (previous_response_id, conversation_id, conversation.id, Claude metadata session, or prompt_cache_key).
        output_response_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          description: Client-facing response or message id extracted from the completed stream.
        input_preview:
          type: [string, "null"]
          minLength: 1
          maxLength: 80
          description: Bounded title from the newest visible user text. URLs and obvious secrets are stripped.
        turn_index:
          type: [integer, "null"]
          minimum: 1
          description: |
            1-based user turn within the session. Every model call of one agent
            loop shares the same value, so a session's turn_count can be far below
            its call_count. The first record of a session is turn 1 whatever its
            history holds; a later record starts a new turn when its history has
            more user messages than the record it links to, or the newest user
            text changed. Null when the protocol has no user turns or on legacy rows.
        turn_user_messages:
          type: [integer, "null"]
          minimum: 0
          description: |
            Number of user messages in this request's history (cumulative for
            stateful Responses chains). The next linked request compares its own
            count against this. Null whenever turn_index is null.
        turn_user_fingerprint:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          description: |
            Keyed fingerprint of this request's newest user text, compared by the
            next linked request to notice a new prompt at an unchanged message
            count (a harness that compacted history). Null without a fingerprint
            key or when turn_index is null. Reveals nothing about the text.
        session_link:
          oneOf:
            - $ref: "#/components/schemas/SessionLink"
            - type: "null"
          description: How this record joined an existing session; null when it started the session.
        cursors:
          type: [array, "null"]
          maxItems: 48
          items:
            $ref: "#/components/schemas/SessionCursor"
          description: |
            Typed values stored for this record: explicit cursors the request named
            (direction in) and everything the response produced (direction out).
            Fingerprints are keyed digests and reveal nothing about the text.
        events:
          type: array
          items:
            $ref: "#/components/schemas/RequestEvent"
          description: Gateway phase events for this attempt. Empty on legacy rows.
        extensions:
          $ref: ./protocol-capabilities.schema.json#/$defs/Extensions
      additionalProperties: false
    SessionCursorKind:
      type: string
      enum: [explicit, echo_id, fingerprint]
      description: |
        explicit: an id the client sent on purpose or the response's own id, matched globally.
        echo_id: an opaque id the model produced and the client echoed back, matched within the same access token and time window.
        fingerprint: keyed digest of the last assistant text, matched like echo_id.
    SessionCursor:
      type: object
      required: [kind, direction, value]
      properties:
        kind:
          $ref: "#/components/schemas/SessionCursorKind"
        direction:
          type: string
          enum: [in, out]
        value:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
    SessionLink:
      type: object
      required: [kind, value]
      properties:
        kind:
          $ref: "#/components/schemas/SessionCursorKind"
        value:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
    RequestModelRedirect:
      type: object
      additionalProperties: false
      required: [from, to]
      description: Model redirect applied to this request. Omitted when no redirect applied, including historical records.
      properties:
        from:
          type: string
          minLength: 1
          maxLength: 256
          description: Client-requested model; equals requested_model.
        to:
          type: string
          minLength: 1
          maxLength: 256
          description: Model used for service selection.
    RequestEvent:
      type: object
      required: [kind, started_at, ended_at, status, summary, attempt_index]
      properties:
        kind:
          type: string
          enum:
            [
              accepted,
              model_redirect,
              privacy,
              routed,
              upstream,
              restore,
              completed,
            ]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/RequestStatus"
        summary:
          type: string
          maxLength: 256
        attempt_index:
          type: integer
          minimum: 0
      additionalProperties: false
    RequestSession:
      type: object
      required:
        - id
        - title
        - started_at
        - last_started_at
        - completed_at
        - duration_ms
        - active_request_starts
        - turn_count
        - call_count
        - status
        - requested_model
        - input_protocol
        - service_id
        - local_access_token_id
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        title:
          type: string
          minLength: 1
          maxLength: 80
        started_at:
          type: string
          format: date-time
        last_started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
          description: Cumulative recorded runtime of finished calls, including retry children, in milliseconds. Excludes gaps between calls and unknown runtime of requests recovered after a Core interruption.
        active_request_starts:
          type: array
          description: Start timestamps of calls still running without a recorded latency. Add their elapsed times to duration_ms for a live cumulative runtime.
          items:
            type: string
            format: date-time
        turn_count:
          type: integer
          minimum: 1
        call_count:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/SessionStatus"
        requested_model:
          type: [string, "null"]
          maxLength: 256
        model_redirect:
          $ref: "#/components/schemas/RequestModelRedirect"
        reasoning_effort:
          type: [string, "null"]
          minLength: 1
          maxLength: 32
          description: Explicit client-requested reasoning level, normalized to lowercase. Null for unspecified levels and historical records; never inferred from model names or token budgets.
        input_protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        service_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
        local_access_token_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
      additionalProperties: false
    RequestSessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestSession"
        next_cursor:
          type: [string, "null"]
      additionalProperties: false
    RequestSessionDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSession"
        - type: object
          required: [turns]
          properties:
            turns:
              type: array
              items:
                $ref: "#/components/schemas/RequestRecord"
          additionalProperties: false
    Usage:
      type: object
      description: |
        OpenAI-style input accounting. input_tokens includes all prompt-side
        tokens (uncached, cache read, cache write/creation, and multimodal
        input). cache_read_tokens / cache_write_tokens are optional subsets.
        Anthropic upstream fields are normalized by summing
        input + cache_read + cache_creation into input_tokens.
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0
        cache_write_1h_tokens: { type: integer, minimum: 0 }
        input_audio_tokens: { type: integer, minimum: 0 }
        output_audio_tokens: { type: integer, minimum: 0 }
        thinking_enabled: { type: boolean }
        billing_incomplete:
          {
            type: boolean,
            description: The upstream stream ended before final usage was observed.,
          }
      additionalProperties: false
    ErrorSummary:
      type: object
      required: [category, code, message, retryable]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
        code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: Operator-visible failure text. Transport errors may include the upstream host, URL, and IP; credentials (Authorization, API keys, sensitive query values) are redacted. Never contains request or response bodies or header maps.
        retryable:
          type: boolean
      additionalProperties: false
    AuditRecordSummary:
      type: object
      required:
        - request_body_captured
        - response_content_captured
        - request_body_truncated
        - response_content_truncated
        - upstream_request_body_captured
        - upstream_response_content_captured
        - upstream_request_body_truncated
        - upstream_response_content_truncated
      properties:
        request_body_captured:
          type: boolean
        response_content_captured:
          type: boolean
        request_body_truncated:
          type: boolean
        response_content_truncated:
          type: boolean
        upstream_request_body_captured:
          type: boolean
        upstream_response_content_captured:
          type: boolean
        upstream_request_body_truncated:
          type: boolean
        upstream_response_content_truncated:
          type: boolean
      additionalProperties: false
    PrivacyRestoreSummary:
      type: object
      required: [enabled, mapping_count, restored_count, fallback_count]
      properties:
        enabled:
          type: boolean
        mapping_count:
          type: integer
          minimum: 0
        restored_count:
          type: integer
          minimum: 0
          description: Total placeholders restored across both channels.
        visible_restored_count:
          type: integer
          minimum: 0
          description: >
            Restored in text the reader sees. Zero on records written before the
            channel split, which report only restored_count.
        tool_argument_restored_count:
          type: integer
          minimum: 0
          description: >
            Restored inside tool or function call arguments. A non-zero value
            means the local agent harness was handed real values to act on, which
            is a materially different event from the model quoting one back.
        fallback_count:
          type: integer
          minimum: 0
        hits:
          type: array
          description: Request-time unique placeholder counts by kind. Absent on records written before this field existed.
          items:
            $ref: "#/components/schemas/PrivacyHitCount"
      additionalProperties: false
    PrivacyHitCount:
      type: object
      required: [kind, count]
      properties:
        kind:
          $ref: "#/components/schemas/PrivacyCanonicalKind"
        count:
          type: integer
          minimum: 1
      additionalProperties: false
    AuditContent:
      type: object
      required:
        - request_id
        - http_meta
        - request_body
        - response_content
        - upstream_http_meta
        - upstream_request_body
        - upstream_response_content
      properties:
        request_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        http_meta:
          oneOf:
            - $ref: "#/components/schemas/AuditHTTPMeta"
            - type: "null"
          description: Redacted client HTTP envelope (ADR 0008); null for children and when capture was disabled.
        request_body:
          oneOf:
            - $ref: "#/components/schemas/AuditContentPart"
            - type: "null"
          description: Original client request body before privacy/model/protocol rewrites; null on children.
        response_content:
          oneOf:
            - $ref: "#/components/schemas/AuditContentPart"
            - type: "null"
          description: Client-visible response after restore transforms; null on children.
        upstream_http_meta:
          oneOf:
            - $ref: "#/components/schemas/AuditHTTPMeta"
            - type: "null"
          description: |
            Redacted upstream envelope for this attempt. URL is path/query only —
            never an upstream origin. Credentials are masked at capture time.
        upstream_request_body:
          oneOf:
            - $ref: "#/components/schemas/AuditContentPart"
            - type: "null"
          description: Exact upstream request body after privacy, model rewrite, and RelayKit conversion.
        upstream_response_content:
          oneOf:
            - $ref: "#/components/schemas/AuditContentPart"
            - type: "null"
          description: Raw upstream response bytes before RelayKit/alias/privacy restoration.
      additionalProperties: false
    AuditHeader:
      type: object
      required: [name, value, redacted]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        value:
          type: string
          maxLength: 2048
          description: Redacted entries carry a masked placeholder, never the original bytes.
        redacted:
          type: boolean
      additionalProperties: false
    AuditHTTPMeta:
      type: object
      required:
        [
          method,
          url,
          http_version,
          request_headers,
          response_status,
          response_headers,
        ]
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 32
        url:
          type: string
          maxLength: 4096
          description: Userinfo stripped and sensitive query parameter values masked at capture time.
        http_version:
          type: string
          maxLength: 16
        request_headers:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/AuditHeader"
        response_status:
          oneOf:
            - type: integer
              minimum: 100
              maximum: 599
            - type: "null"
        response_headers:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/AuditHeader"
      additionalProperties: false
    AuditContentPart:
      type: object
      required: [media_type, content, truncated, captured_bytes]
      properties:
        media_type:
          type: string
          minLength: 1
          maxLength: 128
        content:
          type: string
          description: Decrypted content; never log, cache, diagnose, or include in ordinary exports.
        truncated:
          type: boolean
        captured_bytes:
          type: integer
          minimum: 0
      additionalProperties: false
    PurgeRequest:
      type: object
      required: [scope, confirm]
      properties:
        scope:
          type: string
          enum: [all, before]
        before:
          type: string
          format: date-time
          description: Required when scope is before.
        confirm:
          type: boolean
          const: true
          description: Explicit destructive-action confirmation.
      additionalProperties: false
      allOf:
        - if:
            properties:
              scope:
                const: before
            required: [scope]
          then:
            required: [before]
        - if:
            properties:
              scope:
                const: all
            required: [scope]
          then:
            not:
              required: [before]
    PurgeResult:
      type: object
      required: [deleted_records, deleted_audit_blobs]
      properties:
        deleted_records:
          type: integer
          minimum: 0
        deleted_audit_blobs:
          type: integer
          minimum: 0
      additionalProperties: false
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    RoutePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    PolicyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/Policy"
        next_cursor:
          type: "null"
      additionalProperties: false
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    RequestRecordPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequestRecord"
        next_cursor:
          type: [string, "null"]
          maxLength: 512
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/ControlError"
        request_id:
          type: string
          minLength: 1
          maxLength: 96
      additionalProperties: false
    ControlError:
      type: object
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: "^[a-z][a-z0-9_]*$"
          examples: [missing_protocol_capability, validation_failed]
        message:
          type: string
          minLength: 1
          maxLength: 1024
          description: Sanitized user-facing message.
        retryable:
          type: boolean
        details:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ErrorDetail"
      additionalProperties: false
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          maxLength: 256
        reason:
          type: string
          maxLength: 512
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        required_plan_types:
          type: array
          uniqueItems: true
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/PlanType
      additionalProperties: false
    SubscriptionError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        message:
          type: string
          minLength: 1
          maxLength: 240
      additionalProperties: false
    AuthorizationFlow:
      type: string
      enum: [browser, device_code, authorization_code]
      description: Codex supports browser and device_code. Claude Code supports authorization_code with PKCE and a manual code#state callback. Grok (xai_grok) supports device_code only (RFC 8628 against auth.x.ai).
    AuthorizationStartRequest:
      type: object
      required: [flow]
      properties:
        flow:
          $ref: "#/components/schemas/AuthorizationFlow"
      additionalProperties: false
    AuthorizationDeviceCode:
      type: object
      required: [verification_url, user_code]
      properties:
        verification_url:
          type: string
          maxLength: 4096
        user_code:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    AuthorizationSession:
      type: object
      required:
        [
          id,
          provider,
          status,
          flow,
          service_id,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        provider:
          type: string
          enum: [openai_codex, claude_code, xai_grok]
        status:
          type: string
          enum: [pending, completed, cancelled, expired, failed]
        flow:
          $ref: "#/components/schemas/AuthorizationFlow"
        authorization_url:
          type: string
          maxLength: 4096
        device_code:
          $ref: "#/components/schemas/AuthorizationDeviceCode"
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        expires_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/SubscriptionError"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              status:
                const: pending
              flow:
                enum: [browser, authorization_code]
            required: [status, flow]
          then:
            required: [authorization_url]
            not:
              required: [device_code]
        - if:
            properties:
              status:
                const: pending
              flow:
                const: device_code
            required: [status, flow]
          then:
            required: [device_code]
            not:
              required: [authorization_url]
        - if:
            properties:
              status:
                enum: [completed, cancelled, expired, failed]
            required: [status]
          then:
            not:
              anyOf:
                - required: [authorization_url]
                - required: [device_code]
      additionalProperties: false
    ServiceModelProbe:
      type: object
      required: [protocol, model_ids]
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        protocol:
          type: string
          enum: [openai.models, google.models]
        model_ids:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
      additionalProperties: false
    ServiceTestProtocol:
      type: string
      enum:
        [
          openai.responses,
          openai.chat,
          openai.completions,
          anthropic.messages,
          google.generate_content,
        ]
    ServiceTestRequest:
      type: object
      additionalProperties: false
      required: [protocol, model]
      properties:
        protocol:
          $ref: "#/components/schemas/ServiceTestProtocol"
        model:
          type: string
          minLength: 1
          maxLength: 256
          description: Upstream ID with at most 256 UTF-8 bytes, no control characters or surrounding whitespace. May be outside the saved model list.
        stream:
          type: boolean
          default: false
        prompt:
          type: string
          maxLength: 2000
          description: Defaults to 'Reply with OK.' when omitted or blank.
    ServiceTestResult:
      type: object
      additionalProperties: false
      required:
        [
          service_id,
          protocol,
          model,
          stream,
          ok,
          status_code,
          duration_ms,
          output,
        ]
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        protocol:
          $ref: "#/components/schemas/ServiceTestProtocol"
        model:
          type: string
        stream:
          type: boolean
        ok:
          type: boolean
        status_code:
          type: integer
          minimum: 0
          maximum: 599
          description: Zero when no upstream response was received.
        duration_ms:
          type: integer
          minimum: 0
          description: Total test duration including credential preparation, privacy processing, reading, validation and request-record finalization.
        response_headers_ms:
          type: [integer, "null"]
          minimum: 0
          description: Milliseconds from sending the upstream request to receiving response headers, excluding credential preparation and request privacy processing. Null when headers were not received.
        first_token_ms:
          type: [integer, "null"]
          minimum: 0
          description: Milliseconds from sending the upstream request to the first non-empty visible SSE text after gateway processing. Excludes heartbeats and reasoning. Null for non-streaming responses or when no text arrived. Subtract response_headers_ms for the wait after headers.
        output:
          type: string
          maxLength: 4097
        raw_response:
          type: string
          maxLength: 65537
          description: Gateway-processed response body after configured privacy restoration, including actual JSON or SSE framing, local error envelopes and malformed responses. Credential values are redacted; limited to 65536 characters plus a truncation marker. Empty when no body was received. Older Core versions may omit this field.
        raw_response_truncated:
          type: boolean
          description: True if the body exceeded the size limit or could not be fully read.
        response_content_type:
          type: string
          maxLength: 257
          description: Credential-redacted gateway response Content-Type, when present.
        error_code:
          type: string
        message:
          type: string
          maxLength: 1001
    ServiceResponsesProbe:
      type: object
      required: [service_id, status_code, ok]
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        status_code:
          type: integer
          minimum: 100
          maximum: 599
        ok:
          type: boolean
        response_id:
          type: string
          maxLength: 256
      additionalProperties: false
    RateLimitWindow:
      type: object
      required: [used_percent]
      additionalProperties: false
      properties:
        used_percent:
          type: number
          minimum: 0
          maximum: 1000
        limit_window_seconds:
          type: integer
          minimum: 1
          maximum: 31622400
        reset_at:
          type: string
          format: date-time
        reset_after_seconds:
          type: integer
          minimum: 0
          maximum: 31622400
    AdditionalRateLimit:
      type: object
      required: [limit_name]
      additionalProperties: false
      properties:
        limit_name:
          type: string
          minLength: 1
          maxLength: 128
        metered_feature:
          type: string
          minLength: 1
          maxLength: 128
        primary:
          $ref: "#/components/schemas/RateLimitWindow"
        secondary:
          $ref: "#/components/schemas/RateLimitWindow"
    UsageCredits:
      type: object
      required: [has_credits, unlimited]
      additionalProperties: false
      properties:
        has_credits:
          type: boolean
        unlimited:
          type: boolean
        balance:
          type: string
          maxLength: 32
    UsageQuota:
      description: |
        Prepaid API-key allowance valued in USD, reported by a New API key. An
        unlimited key only reports what it has spent.
      type: object
      required: [unlimited, used_usd]
      additionalProperties: false
      properties:
        unlimited:
          type: boolean
        used_usd:
          type: string
          pattern: '^[0-9]{1,15}(\.[0-9]{1,6})?$'
        remaining_usd:
          description: Present only for a limited key.
          type: string
          pattern: '^[0-9]{1,15}(\.[0-9]{1,6})?$'
        total_usd:
          description: Present only for a limited key; used plus remaining.
          type: string
          pattern: '^[0-9]{1,15}(\.[0-9]{1,6})?$'
        expires_at:
          type: string
          format: date-time
    RateLimitResetCredits:
      type: object
      required: [available_count]
      additionalProperties: false
      properties:
        available_count:
          type: integer
          minimum: 0
          maximum: 1000
    SubscriptionUsage:
      type: object
      required: [service_id, fetched_at]
      additionalProperties: false
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        fetched_at:
          type: string
          format: date-time
        plan_type:
          type: string
          maxLength: 64
        allowed:
          type: boolean
        limit_reached:
          type: boolean
        primary:
          $ref: "#/components/schemas/RateLimitWindow"
        secondary:
          $ref: "#/components/schemas/RateLimitWindow"
        additional_rate_limits:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/AdditionalRateLimit"
        credits:
          $ref: "#/components/schemas/UsageCredits"
        quota:
          $ref: "#/components/schemas/UsageQuota"
        rate_limit_reset_credits:
          $ref: "#/components/schemas/RateLimitResetCredits"
    SubscriptionUsageReset:
      type: object
      required: [service_id, outcome]
      additionalProperties: false
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        outcome:
          type: string
          enum: [reset, nothing_to_reset, no_credit, already_redeemed]
        windows_reset:
          type: integer
          minimum: 0
