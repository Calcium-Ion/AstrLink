  /control/v1/service-proxy-probes:
    x-astrlink-implementation-status: implemented
    post:
      tags: [Services]
      operationId: probeServiceProxy
      summary: Test an unsaved custom proxy against an HTTP target.
      description: Sends a HEAD request with a 10-second timeout, without saving the draft, sending API credentials, or following redirects. An omitted proxy credential reuses the given service's stored proxy authentication; null clears it for this test only. An HTTP response other than 407 confirms a response was received, not API authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proxy, target_url]
              properties:
                service_id:
                  $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
                proxy:
                  allOf:
                    - $ref: "#/components/schemas/ServiceProxyInput"
                    - properties:
                        mode: { const: custom }
                target_url:
                  type: string
                  maxLength: 2048
                  description: HTTP or HTTPS target without userinfo, query or fragment.
              additionalProperties: false
      responses:
        "200":
          description: A response was received through the proxy.
          content:
            application/json:
              schema:
                type: object
                required: [latency_ms, status_code]
                properties:
                  latency_ms: { type: integer, minimum: 0 }
                  status_code:
                    {
                      type: integer,
                      minimum: 100,
                      maximum: 599,
                      not: { const: 407 },
                    }
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
