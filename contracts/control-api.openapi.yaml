  /control/v1/services/{service_id}/test:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      operationId: testService
      summary: Send one real text generation request to a saved provider.
      description: |
        Uses saved credentials and a directly configured native or delegated
        protocol, without local conversion, retries, repair resends or failover. Disabled providers can
        be tested; subscriptions must be connected. May consume upstream quota.
        Codex subscriptions require stream=true. Times out after 60 seconds.
        Applies the current gateway privacy policy and response restoration, and
        writes request records using existing audit settings. Does not enable
        body capture or mutate provider configuration or routing health. Responses are
        bounded to 1 MiB. Returned text is redacted and limited to 4096 characters
        plus a truncation marker. Inference failures return HTTP 200 with ok=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTestRequest"
