          maximum: 599
        latency_ms:
          type: [integer, "null"]
          minimum: 0
        usage:
          oneOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
