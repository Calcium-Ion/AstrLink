openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AstrLink Local Control API
  version: 1.0.0
  summary: Stable local contract between the AstrLink desktop application and Core.
  description: |
    This API is a local control plane; it is not part of the public inference API.
    Core binds the inference plane to `127.0.0.1:8317` by default and binds this
    control plane to the ephemeral address `127.0.0.1:0`. On startup Core writes
    exactly one ready JSON line to stdout containing the selected `control_url`.
    Launchers must use that value rather than guessing a port.

    The bootstrap health, version, and capability operations are intentionally
    unauthenticated and disclose no configuration. Every operation that reads or
    mutates user configuration, events, or request records requires the per-start
    local control token. The token must be delivered through an inherited pipe or
    equivalent protected IPC; it must not be placed in process arguments or the
    environment.

    Request and response bodies are excluded from ordinary request records. The two
    audit-body switches are independent, default to false, and can only be enabled
    through this authenticated control API after explicit risk acknowledgement.

    The three bootstrap GET operations are always available. Authenticated Service
    CRUD, service-scoped subscription OAuth, priority Route CRUD, persistent local
    access-token operations, the fixed
    privacy policy, and selectable privacy-model catalog/installation management
    are available when Core is launched with its persistent data directory and a
    per-start control token delivered over stdin. The stable auto Route shape is
    rejected with 422 until the classifier runtime reaches its activation gates.
    Remaining paths freeze the forward control contract and stay marked
    `x-astrlink-implementation-status: planned`; their presence is not a runtime
    capability claim.
servers:
  - url: http://127.0.0.1:{control_port}
    description: Runtime loopback control address announced by Core on stdout.
    variables:
      control_port:
        default: "0"
        description: Ephemeral port; replace 0 with the value from the ready announcement.
security:
  - controlToken: []
x-astrlink-implementation:
  milestone: M3-unified-service-slice
  implemented_operations:
    - GET /control/v1/health
    - GET /control/v1/version
    - GET /control/v1/capabilities
    - GET /control/v1/services
    - POST /control/v1/services
    - GET /control/v1/services/{service_id}
    - PATCH /control/v1/services/{service_id}
    - DELETE /control/v1/services/{service_id}
    - POST /control/v1/services/{service_id}/authorization
    - GET /control/v1/services/{service_id}/authorization
    - DELETE /control/v1/services/{service_id}/authorization
    - POST /control/v1/services/{service_id}/logout
    - POST /control/v1/services/{service_id}/probe-models
    - POST /control/v1/services/{service_id}/probe-responses
    - GET /control/v1/access-tokens
    - POST /control/v1/access-tokens
    - GET /control/v1/access-tokens/{token_id}/secret
    - DELETE /control/v1/access-tokens/{token_id}
    - GET /control/v1/policies
    - GET /control/v1/policies/{policy_id}
    - PATCH /control/v1/policies/{policy_id}
    - POST /control/v1/policies/{policy_id}/dry-run
    - GET /control/v1/privacy-model-catalog
    - POST /control/v1/privacy-models/probe
    - GET /control/v1/privacy-models
    - POST /control/v1/privacy-models
    - GET /control/v1/privacy-models/{installation_id}
    - DELETE /control/v1/privacy-models/{installation_id}
    - GET /control/v1/requests
    - GET /control/v1/requests/{request_id}
    - DELETE /control/v1/requests/{request_id}
    - POST /control/v1/requests/purge
    - GET /control/v1/requests/{request_id}/audit
    - GET /control/v1/audit-settings
    - PATCH /control/v1/audit-settings
  planned_operations: all other operations in this document
x-astrlink-ready-announcement:
  transport: single JSON line on stdout after both listeners bind
  schema:
    $ref: "#/components/schemas/ReadyEvent"
tags:
  - name: Bootstrap
    description: Non-sensitive process bootstrap and compatibility handshake.
  - name: Services
    description: |
      The sole top-level API-service aggregate. Codex subscriptions and HTTP
      providers/gateways are service variants with independent IDs.
  - name: Access Tokens
    description: Persistent local inference credentials. Secrets are returned only by explicit create and reveal operations.
  - name: Routes
    description: Priority routing plus the reserved `astrlink/auto` virtual-model candidate pool.
  - name: Policies
    description: Content safety policies and privileged encrypted body-audit settings.
  - name: Privacy Model
    description: Integrity-checked catalog and lifecycle for selectable local privacy-model installations.
  - name: Events
    description: Sanitized operational events.
  - name: Requests
    description: Request metadata and explicitly enabled encrypted audit content.
paths:
  /control/v1/health:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Bootstrap]
      operationId: getHealth
      summary: Check whether Core is ready to serve the control API.
      security: []
      responses:
        "200":
          description: Core is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: Core is alive but not ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: starting
  /control/v1/version:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Bootstrap]
      operationId: getVersion
      summary: Read Core and contract versions for desktop compatibility checks.
      security: []
      responses:
        "200":
          description: Version handshake information.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                core_version: 0.1.0-dev
                control_api_version: v1
                protocol_contract_version: v1
                build_commit: unknown
  /control/v1/capabilities:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Bootstrap]
      operationId: getCapabilities
      summary: Read the protocol registry and execution-mode capabilities.
      description: |
        The Alpha response always declares native and delegated as available in
        Alpha. RelayKit remains visible as a future plan type, but
        `available_in_alpha` is false. Until RelayKit is integrated,
        `conversion_engine.available` is false, `version` is null, and `edges` is
        empty.
      security: []
      responses:
        "200":
          description: Protocol and planning capabilities.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: ./protocol-capabilities.schema.json
              example:
                protocol_contract_version: v1
                protocols:
                  - id: openai.responses
                    phase: alpha
                    primary: true
                    streaming: true
                  - id: openai.responses.compact
                    phase: alpha
                    primary: false
                    streaming: false
                  - id: anthropic.messages
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: google.generate_content
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: openai.chat
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: openai.completions
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: openai.models
                    phase: alpha
                    primary: false
                    streaming: false
                  - id: google.models
                    phase: alpha
                    primary: false
                    streaming: false
                plan_types:
                  - id: native
                    available_in_alpha: true
                    uses_local_conversion: false
                  - id: delegated
                    available_in_alpha: true
                    uses_local_conversion: false
                  - id: relaykit
                    available_in_alpha: false
                    uses_local_conversion: true
                conversion_engine:
                  name: relaykit
                  version: null
                  available: false
                  edges: []
  /control/v1/services:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Services]
      operationId: listServices
      summary: List every configured API service, including subscription and HTTP variants.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ServiceKind"
      responses:
        "200":
          description: Service page. Credential secrets and OAuth tokens are never returned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Services]
      operationId: createService
      summary: Create one independently addressable API service.
      description: |
        `codex_subscription` creates a disconnected service that is authorized
        through its service-scoped OAuth operation. HTTP kinds such as `newapi`
        carry an `http` connection and optional write-only credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreate"
      responses:
        "201":
          description: Service created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /control/v1/services/{service_id}:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [Services]
      operationId: getService
      summary: Read one service without exposing credential material.
      responses:
        "200":
          description: Service details.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Services]
      operationId: updateService
      summary: Update service metadata or an HTTP service connection.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ServicePatch"
      responses:
        "200":
          description: Updated service.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Services]
      operationId: deleteService
      summary: Delete one service after route-reference checks.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Service and its local credential material were deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /control/v1/services/{service_id}/authorization:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      operationId: beginServiceAuthorization
      summary: Start browser or Device Code OAuth for this subscription service only.
      requestBody:
        required: false
        description: Omit the body only for legacy browser-flow callers; JSON bodies must include an explicit flow.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationStartRequest"
      responses:
        "202":
          description: Service-scoped authorization session started.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [Services]
      operationId: getServiceAuthorization
      summary: Read the current OAuth session for this service.
      responses:
        "200":
          description: Authorization session without codes, verifiers, or tokens.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Services]
      operationId: cancelServiceAuthorization
      summary: Cancel the pending OAuth session for this service.
      responses:
        "200":
          description: Cancelled authorization session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/services/{service_id}/logout:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      operationId: logoutService
      summary: Delete OAuth credentials while retaining the subscription service.
      responses:
        "200":
          description: Disconnected service.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /control/v1/services/{service_id}/probe-models:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      operationId: probeServiceModels
      summary: Discover models through a connected subscription service.
      responses:
        "200":
          description: Provider model list summary.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceModelProbe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/services/{service_id}/probe-responses:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    post:
      tags: [Services]
      operationId: probeServiceResponses
      summary: Execute one non-streaming Responses probe through a connected subscription service.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "200":
          description: Probe summary without upstream credential material.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceResponsesProbe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
  /control/v1/access-tokens:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Access Tokens]
      operationId: listAccessTokens
      summary: List persistent local inference access-token metadata.
      responses:
        "200":
          description: Access-token metadata. Secret values and hashes are never included.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Access Tokens]
      operationId: createAccessToken
      summary: Create a persistent local inference access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenCreate"
      responses:
        "201":
          description: Token created. The complete secret is returned only by this explicit operation and the reveal operation.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /control/v1/access-tokens/{token_id}:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/AccessTokenId"
    delete:
      tags: [Access Tokens]
      operationId: deleteAccessToken
      summary: Permanently delete a local inference access token.
      responses:
        "204":
          description: Token metadata and secret were deleted. New inference requests using it are rejected immediately.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/access-tokens/{token_id}/secret:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/AccessTokenId"
    get:
      tags: [Access Tokens]
      operationId: revealAccessToken
      summary: Explicitly reveal one persistent local inference access-token secret.
      responses:
        "200":
          description: Complete token secret. This response must not be logged or included in diagnostics.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenReveal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/routes:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Routes]
      operationId: listRoutes
      summary: List routes in deterministic evaluation order.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Route page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Routes]
      operationId: createRoute
      summary: Create a route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteCreate"
      responses:
        "201":
          description: Route created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /control/v1/routes/{route_id}:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/RouteId"
    get:
      tags: [Routes]
      operationId: getRoute
      summary: Read one route.
      responses:
        "200":
          description: Route details.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Routes]
      operationId: updateRoute
      summary: Update a route.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/RoutePatch"
      responses:
        "200":
          description: Updated route.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Routes]
      operationId: deleteRoute
      summary: Delete a route.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Route deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /control/v1/policies:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Policies]
      operationId: listPolicies
      summary: List the fixed MVP privacy policy.
      responses:
        "200":
          description: Policy page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      x-astrlink-implementation-status: planned
      tags: [Policies]
      operationId: createPolicy
      summary: Create a policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreate"
      responses:
        "201":
          description: Policy created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /control/v1/policies/{policy_id}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    get:
      x-astrlink-implementation-status: implemented
      tags: [Policies]
      operationId: getPolicy
      summary: Read one policy.
      responses:
        "200":
          description: Policy details.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      x-astrlink-implementation-status: implemented
      tags: [Policies]
      operationId: updatePolicy
      summary: Update a policy.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/PolicyPatch"
      responses:
        "200":
          description: Updated policy.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      x-astrlink-implementation-status: planned
      tags: [Policies]
      operationId: deletePolicy
      summary: Delete a policy.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Policy deleted. Existing audit records are not implicitly deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /control/v1/policies/{policy_id}/dry-run:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    post:
      x-astrlink-implementation-status: implemented
      tags: [Policies]
      operationId: dryRunPolicy
      summary: Preview privacy-policy evaluation against sample text.
      description: |
        Wraps sample_text into a minimal request body for the selected protocol,
        evaluates the effective policy (stored values merged with optional
        patchable overrides), and returns the decision plus finding locations.
        Matched plaintext is never returned. Does not forward upstream or mutate
        stored policy state. Only policy_privacy_default is supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDryRunRequest"
      responses:
        "200":
          description: Dry-run completed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDryRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /control/v1/privacy-model-catalog:
