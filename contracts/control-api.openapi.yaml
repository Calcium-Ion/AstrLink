openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AstrLink Local Control API
  version: 1.0.0
  summary: Stable local contract between the AstrLink desktop application and Core.
  description: |
    This API is a local control plane; it is not part of the public inference API.
    Core binds the inference plane to `127.0.0.1:8317` by default and binds this
    control plane to the ephemeral address `127.0.0.1:0`. On startup Core writes
    exactly one ready JSON line to stdout containing the selected `control_url`.
    Launchers must use that value rather than guessing a port.

    The bootstrap health, version, and capability operations are intentionally
    unauthenticated and disclose no configuration. Every operation that reads or
    mutates user configuration, events, or request records requires the per-start
    local control token. The token must be delivered through an inherited pipe or
    equivalent protected IPC; it must not be placed in process arguments or the
    environment.

    Request and response bodies are excluded from ordinary request records. The two
    audit-body switches are independent, default to false, and can only be enabled
    through this authenticated control API after explicit risk acknowledgement.

    The three bootstrap GET operations are always available. Authenticated Service
    CRUD, service-scoped subscription OAuth, priority Route CRUD, persistent local
    access-token operations, the fixed
    privacy policy, and selectable privacy-model catalog/installation management
    are available when Core is launched with its persistent data directory and a
    per-start control token delivered over stdin. The stable auto Route shape is
    rejected with 422 until the classifier runtime reaches its activation gates.
    Remaining paths freeze the forward control contract and stay marked
    `x-astrlink-implementation-status: planned`; their presence is not a runtime
    capability claim.
servers:
  - url: http://127.0.0.1:{control_port}
    description: Runtime loopback control address announced by Core on stdout.
    variables:
      control_port:
        default: "0"
        description: Ephemeral port; replace 0 with the value from the ready announcement.
security:
  - controlToken: []
x-astrlink-implementation:
  milestone: M3-unified-service-slice
  implemented_operations:
    - "GET /control/v1/intelligence/settings"
    - "PUT /control/v1/intelligence/settings"
    - "GET /control/v1/intelligence/channels/{service_id}"
    - "PUT /control/v1/intelligence/channels/{service_id}"
    - "GET /control/v1/intelligence/channels/{service_id}/runs"
    - "POST /control/v1/intelligence/channels/{service_id}/runs"
    - "GET /control/v1/intelligence/runs/{run_id}"
    - "POST /control/v1/intelligence/runs/{run_id}/render"
    - "POST /control/v1/intelligence/runs/{run_id}/cancel"
    - GET /control/v1/pricing/status
    - GET /control/v1/pricing/catalog
    - POST /control/v1/pricing/sync
    - GET /control/v1/pricing/summary
    - GET /control/v1/pricing/services/{service_id}
    - PUT /control/v1/pricing/services/{service_id}
    - POST /control/v1/pricing/services/{service_id}/backfill
    - GET /control/v1/health
    - GET /control/v1/version
    - GET /control/v1/capabilities
    - GET /control/v1/services
    - POST /control/v1/services
    - GET /control/v1/services/{service_id}
    - PATCH /control/v1/services/{service_id}
    - DELETE /control/v1/services/{service_id}
    - POST /control/v1/services/{service_id}/authorization
    - GET /control/v1/services/{service_id}/authorization
    - DELETE /control/v1/services/{service_id}/authorization
    - POST /control/v1/services/{service_id}/logout
    - POST /control/v1/services/{service_id}/probe-models
    - POST /control/v1/service-model-probes
    - POST /control/v1/service-proxy-probes
    - POST /control/v1/services/{service_id}/probe-responses
    - GET /control/v1/services/{service_id}/usage
    - POST /control/v1/services/{service_id}/usage/reset
    - GET /control/v1/access-tokens
    - GET /control/v1/access-token-usage
    - GET /control/v1/usage-summary
    - POST /control/v1/access-tokens
    - GET /control/v1/access-tokens/{token_id}/secret
    - DELETE /control/v1/access-tokens/{token_id}
    - GET /control/v1/policies
    - GET /control/v1/policies/{policy_id}
    - PATCH /control/v1/policies/{policy_id}
    - POST /control/v1/policies/{policy_id}/dry-run
    - GET /control/v1/privacy/regex-builtin-rules
    - GET /control/v1/privacy-model-catalog
    - POST /control/v1/privacy-models/probe
    - POST /control/v1/privacy-models/local/probe
    - GET /control/v1/privacy-models
    - POST /control/v1/privacy-models
    - GET /control/v1/privacy-models/{installation_id}
    - DELETE /control/v1/privacy-models/{installation_id}
    - GET /control/v1/requests
    - GET /control/v1/requests/{request_id}
    - DELETE /control/v1/requests/{request_id}
    - GET /control/v1/requests/{request_id}/children
    - POST /control/v1/requests/purge
    - GET /control/v1/requests/{request_id}/audit
    - GET /control/v1/audit-settings
    - PATCH /control/v1/audit-settings
    - POST /control/v1/auto-classifier/local/probe
    - GET /control/v1/auto-classifier
    - POST /control/v1/auto-classifier
    - POST /control/v1/auto-classifier/classify-preview
  planned_operations: all other operations in this document
x-astrlink-ready-announcement:
  transport: single JSON line on stdout after both listeners bind
  schema:
    $ref: "#/components/schemas/ReadyEvent"
tags:
  - name: Bootstrap
    description: Non-sensitive process bootstrap and compatibility handshake.
  - name: Services
    description: |
      The sole top-level API-service aggregate. Codex subscriptions and HTTP
      providers/gateways are service variants with independent IDs.
  - name: Access Tokens
    description: Persistent local inference credentials. Secrets are returned only by explicit create and reveal operations.
  - name: Routes
    description: Priority routing plus the reserved `astrlink/auto` virtual-model candidate pool.
  - name: Policies
    description: Content safety policies and privileged encrypted body-audit settings.
  - name: Privacy Model
    description: Integrity-checked catalog and lifecycle for selectable local privacy-model installations.
  - name: Auto Classifier
    description: Local-directory inspect, install, and dry-run classify for the frozen astrlink-text-v1 worker. An installed experimental or released artifact is routing-eligible.
  - name: Events
    description: Sanitized operational events.
  - name: Requests
    description: Request metadata and explicitly enabled encrypted audit content.
paths:
  "/control/v1/intelligence/settings":
    {
      "get":
        {
          "operationId": "getIntelligenceSettings",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/IntelligenceSettings",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
        },
      "put":
        {
          "operationId": "saveIntelligenceSettings",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["ok"],
                              "properties": { "ok": { "type": "boolean" } },
                              "additionalProperties": false,
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/IntelligenceSettings" },
                    },
                },
            },
        },
    }
  "/control/v1/intelligence/channels/{service_id}":
    {
      "parameters": [{ "$ref": "#/components/parameters/ServiceId" }],
      "get":
        {
          "operationId": "getIntelligenceChannel",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/IntelligenceChannel",
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
        },
      "put":
        {
          "operationId": "saveIntelligenceChannel",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["ok"],
                              "properties": { "ok": { "type": "boolean" } },
                              "additionalProperties": false,
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/IntelligenceChannel" },
                    },
                },
            },
        },
    }
  "/control/v1/intelligence/channels/{service_id}/runs":
    {
      "parameters": [{ "$ref": "#/components/parameters/ServiceId" }],
      "get":
        {
          "operationId": "listIntelligenceRuns",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "array",
                              "items":
                                {
                                  "$ref": "#/components/schemas/IntelligenceRun",
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
        },
      "post":
        {
          "operationId": "startIntelligenceRun",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/IntelligenceRun" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/IntelligenceStart" },
                    },
                },
            },
        },
    }
  "/control/v1/intelligence/runs/{run_id}":
    {
      "parameters":
        [
          {
            "name": "run_id",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "pattern": "^[a-zA-Z0-9_-]{32}$" },
          },
        ],
      "get":
        {
          "operationId": "getIntelligenceRun",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/IntelligenceRun" },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
        },
    }
  "/control/v1/intelligence/runs/{run_id}/render":
    {
      "parameters":
        [
          {
            "name": "run_id",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "pattern": "^[a-zA-Z0-9_-]{32}$" },
          },
        ],
      "post":
        {
          "operationId": "renderIntelligenceQuestion",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["ok"],
                              "properties": { "ok": { "type": "boolean" } },
                              "additionalProperties": false,
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/IntelligenceRender" },
                    },
                },
            },
        },
    }
  "/control/v1/intelligence/runs/{run_id}/cancel":
    {
      "parameters":
        [
          {
            "name": "run_id",
            "in": "path",
            "required": true,
            "schema": { "type": "string", "pattern": "^[a-zA-Z0-9_-]{32}$" },
          },
        ],
      "post":
        {
          "operationId": "cancelIntelligenceRun",
          "x-astrlink-implementation-status": "implemented",
          "responses":
            {
              "200":
                {
                  "description": "Success",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["ok"],
                              "properties": { "ok": { "type": "boolean" } },
                              "additionalProperties": false,
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/BadRequest" },
              "401": { "$ref": "#/components/responses/Unauthorized" },
            },
        },
    }
  /control/v1/pricing/status:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: getPricingStatus
      summary: Read official price synchronization status.
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingStatus" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
  /control/v1/pricing/catalog:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: getPriceCatalog
      summary: Read canonical first-party API prices.
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceCatalog" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
  /control/v1/pricing/sync:
    post:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: syncOfficialPrices
      summary: Synchronize the official API price catalog.
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingStatus" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
  /control/v1/pricing/summary:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: getBillingSummary
      summary: Aggregate retained call amounts in a half-open time range.
      parameters:
        - {
            name: from,
            in: query,
            required: true,
            schema: { type: string, format: date-time },
          }
        - {
            name: to,
            in: query,
            required: true,
            schema: { type: string, format: date-time },
          }
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
  /control/v1/pricing/services/{service_id}:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: getServiceBilling
      summary: Read account-scoped official quota windows and monthly amounts.
      parameters:
        - name: service_id
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 96 }
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceBilling" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
    put:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: configureServicePricing
      summary: Configure official provider mappings and a monthly reference budget.
      parameters:
        - name: service_id
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 96 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingConfig" }
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingConfig" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
  /control/v1/pricing/services/{service_id}/backfill:
    post:
      x-astrlink-implementation-status: implemented
      tags: [Services]
      operationId: backfillServicePricing
      summary: Value unpriced historical calls using current official prices.
      parameters:
        - name: service_id
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 96 }
      responses:
        "200":
          description: Local reference pricing result, denominated in USD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingBackfill" }
        "400": { description: Invalid input. }
        "401": { description: Local control authentication required. }
        "404": { description: Service not found. }
        "502":
          {
            description: Price synchronization failed; last valid catalog retained.,
          }
  /control/v1/health:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Bootstrap]
      operationId: getHealth
      summary: Check whether Core is ready to serve the control API.
      security: []
      responses:
        "200":
          description: Core is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: Core is alive but not ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: starting
  /control/v1/version:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Bootstrap]
      operationId: getVersion
      summary: Read Core and contract versions for desktop compatibility checks.
      security: []
      responses:
        "200":
          description: Version handshake information.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                core_version: 0.1.0-dev
                control_api_version: v1
                protocol_contract_version: v1
                build_commit: unknown
  /control/v1/capabilities:
    get:
      x-astrlink-implementation-status: implemented
      tags: [Bootstrap]
      operationId: getCapabilities
      summary: Read the protocol registry and execution-mode capabilities.
      description: |
        The Alpha response always declares native and delegated as available in
        Alpha. RelayKit remains visible as a future plan type, but
        `available_in_alpha` is false. Until RelayKit is integrated,
        `conversion_engine.available` is false, `version` is null, and `edges` is
        empty.
      security: []
      responses:
        "200":
          description: Protocol and planning capabilities.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: ./protocol-capabilities.schema.json
              example:
                protocol_contract_version: v1
                protocols:
                  - id: openai.responses
                    phase: alpha
                    primary: true
                    streaming: true
                  - id: openai.responses.compact
                    phase: alpha
                    primary: false
                    streaming: false
                  - id: anthropic.messages
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: google.generate_content
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: openai.chat
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: openai.completions
                    phase: alpha
                    primary: false
                    streaming: true
                  - id: openai.models
                    phase: alpha
                    primary: false
                    streaming: false
                  - id: google.models
                    phase: alpha
                    primary: false
                    streaming: false
                plan_types:
                  - id: native
                    available_in_alpha: true
                    uses_local_conversion: false
                  - id: delegated
                    available_in_alpha: true
                    uses_local_conversion: false
                  - id: relaykit
                    available_in_alpha: false
                    uses_local_conversion: true
                conversion_engine:
                  name: relaykit
                  version: null
                  available: false
                  edges: []
  /control/v1/service-order:
    get:
      operationId: getServiceOrder
      summary: Read the complete global service priority order
      security:
        - controlToken: []
      responses:
        "200":
          description: All service IDs in priority order, including disabled services
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
    put:
      operationId: updateServiceOrder
      summary: Atomically replace the complete service order
      security:
        - controlToken: []
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrder"
      responses:
        "200":
          description: Saved order
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"
        "412":
          description: Service membership or order has changed; reload before retrying
        "422":
          description: Duplicate, missing or unknown service IDs
        "428":
          description: If-Match is required
  /control/v1/services:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Services]
      operationId: listServices
      summary: List every configured API service, including subscription and HTTP variants.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ServiceKind"
      responses:
        "200":
          description: Service page. Credential secrets and OAuth tokens are never returned.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Services]
      operationId: createService
      summary: Create one independently addressable API service.
      description: |
        `codex_subscription`, `claude_subscription` and `grok_subscription` create a
        disconnected service that is authorized through its service-scoped OAuth
        operation. HTTP kinds such as `newapi`
        carry an `http` connection and optional write-only credential.
      requestBody:
