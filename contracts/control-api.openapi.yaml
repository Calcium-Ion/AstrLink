      summary: Update the privileged global body-audit settings.
      description: |
        M0 does not implement this planned operation. Enabling request-body or
        response-content capture requires `audit_risk_acknowledged=true` in the
        same request. Disabling capture immediately stops new body records and does
        not delete existing encrypted records.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AuditSettingsPatch"
      responses:
        "200":
          description: Updated audit settings.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: ./protocol-capabilities.schema.json#/$defs/AuditSettings
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /control/v1/events:
    x-astrlink-implementation-status: planned
    get:
      tags: [Events]
      operationId: listEvents
      summary: List sanitized operational events.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/EventSeverity"
        - name: type
          in: query
          schema:
            type: string
            maxLength: 96
            pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$"
      responses:
        "200":
          description: Event page. Attributes are sanitized and never contain credentials or bodies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/requests:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Requests]
      operationId: listRequestRecords
      summary: List root request metadata records.
      description: |
        Paginates root records only (parent_request_id null). Failed retry children
        are not listed here; fetch them via /requests/{request_id}/children.
        Service/status/protocol filters that match a child still surface its root
        group. Time ordering and cursors are based on the root. This operation
        never returns request or response body content.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: protocol
          in: query
          schema:
            $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        - name: service_id
          in: query
          schema:
            $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        - name: local_access_token_id
          in: query
          description: Restrict to root records attributed to any of these local access tokens. Repeat the parameter for multiple token IDs.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Request-record page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecordPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/requests/{request_id}:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      operationId: getRequestRecord
      summary: Read one request metadata record.
      responses:
        "200":
          description: Request metadata without body content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Requests]
      operationId: deleteRequestRecord
      summary: Delete one metadata record and its encrypted audit content, if any.
      responses:
        "204":
          description: Record and associated encrypted audit blobs deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/requests/{request_id}/audit:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      operationId: getRequestAuditContent
      summary: Decrypt and read explicitly captured audit content.
      description: |
        Available only through the authenticated local control plane. A null part
        means that direction was disabled or no content was captured. This response
        must not be logged, cached, included in diagnostics, or exported as ordinary
        configuration. Root records may expose client and upstream sides; retry
        children expose only their own upstream capture fields.
      responses:
        "200":
          description: Decrypted audit content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /control/v1/requests/{request_id}/children:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Requests]
      operationId: listRequestRecordChildren
      summary: List failed retry attempts folded under a root request record.
      description: |
        Returns independent child request records for earlier upstream attempts,
        ordered by attempt_index ascending. The parent request_id must identify a
        root record (parent_request_id null). Each child remains addressable through
        the ordinary record and audit endpoints.
      responses:
        "200":
          description: Child request metadata without body content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestRecordPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/requests/purge:
    x-astrlink-implementation-status: implemented
    post:
      tags: [Requests]
      operationId: purgeRequestRecords
      summary: Explicitly delete request records and associated encrypted audit content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRequest"
      responses:
        "200":
          description: Purge result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/request-sessions:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Requests]
      operationId: listRequestSessions
      summary: List conversation sessions aggregated from root request records.
      description: |
        Groups root records that share a session_id. Roots with a null session_id
        appear as singleton sessions whose id is the request id. Does not return
        request or response body content.
      parameters:
        - name: kind
          in: query
          description: >
            Filters before pagination. Discovery includes openai.models and
            google.models; inference includes all other protocols. Omit for all.
          schema:
            type: string
            enum: [inference, discovery]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: protocol
          in: query
          schema:
            $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        - name: service_id
          in: query
          schema:
            $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        - name: local_access_token_id
          in: query
          description: Restrict to sessions containing root records attributed to any of these local access tokens. Repeat the parameter for multiple token IDs.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        - name: status
          in: query
          description: >
            Keeps sessions that contain at least one root record with this
            status. It filters records, not the aggregated session outcome, so
            the returned status field may differ and SessionStatus values
            without a record counterpart are not accepted.
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Request-session page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /control/v1/request-sessions/{session_id}:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Requests]
      operationId: getRequestSession
      summary: Read one session summary and its root turns in time order.
      responses:
        "200":
          description: Session detail without body content.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestSessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /control/v1/request-sessions/{session_id}/channel-bindings:
    x-astrlink-implementation-status: implemented
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Requests]
      parameters:
        - name: before
          in: query
          description: Read older audit events before this event id; active bindings are always current.
          schema: { type: integer, minimum: 1 }
      operationId: getSessionChannelBindings
      summary: Read active channel preferences and the latest 100 binding audit events.
      responses:
        "200":
          description: Local session channel bindings and audit history, without conversation text.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelBindingAudit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Requests]
      operationId: releaseSessionChannelBindings
      summary: Release all ordinary channel preferences for this session and fence in-flight writes.
      description: Preserves request records, audit history and strict Responses or WebSocket bindings. The next ordinary request follows service order and may choose the same channel.
      responses:
        "200":
          description: Updated bindings and audit history.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelBindingAudit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    controlToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-control-token
      description: Per-start local token delivered over protected IPC; never persist it in configuration or logs.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous page. It must not be parsed by clients.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    From:
      name: from
      in: query
      description: Inclusive lower timestamp bound.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive upper timestamp bound.
      schema:
        type: string
        format: date-time
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    AccessTokenId:
      name: token_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest GET; prevents lost updates.
      schema:
        type: string
        minLength: 3
        maxLength: 128
  headers:
    NoStore:
      description: Sensitive local-control responses must not be cached.
      schema:
        type: string
        examples: [no-store]
    Location:
      description: Relative path of the created resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Strong entity tag for the current resource representation.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request, query, or cursor.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid local control token.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with current state or references.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: If-Match does not match the current resource representation.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request is well-formed but violates a contract or safety invariant.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Local privacy policy or safety engine is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: The local privacy-model operation or persistent state failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Public model metadata could not be fetched or verified.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GatewayTimeout:
      description: The upstream model-discovery request exceeded its deadline.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    "IntelligenceQuestion":
      {
        "type": "object",
        "required": ["id", "name", "kind", "prompt", "answer", "model"],
        "properties":
          {
            "id": { "type": "string" },
            "name": { "type": "string" },
            "kind": { "enum": ["number", "text", "svg"] },
            "prompt": { "type": "string" },
            "answer": { "type": "string" },
            "model": { "type": "string" },
            "reference_png": { "type": "string" },
          },
        "additionalProperties": false,
      }
    "IntelligenceSettings":
      {
        "type": "object",
        "required":
          [
            "default_model",
            "judge_service_id",
            "judge_model",
            "timeout_seconds",
            "questions",
            "default_question_ids",
          ],
        "properties":
          {
            "default_model": { "type": "string" },
            "judge_service_id": { "type": "string" },
            "judge_model": { "type": "string" },
            "timeout_seconds":
              { "type": "integer", "minimum": 1, "maximum": 300 },
            "questions":
              {
                "type": "array",
                "items":
                  { "$ref": "#/components/schemas/IntelligenceQuestion" },
              },
            "default_question_ids":
              { "type": "array", "items": { "type": "string" } },
          },
        "additionalProperties": false,
      }
    "IntelligenceChannel":
      {
        "type": "object",
        "required": ["use_default", "model", "question_ids"],
        "properties":
          {
            "use_default": { "type": "boolean" },
            "model": { "type": "string" },
            "question_ids": { "type": "array", "items": { "type": "string" } },
          },
        "additionalProperties": false,
      }
    "IntelligenceStart":
      {
        "type": "object",
        "required": ["mode"],
        "properties":
          {
            "mode": { "enum": ["all", "random"] },
            "count": { "type": "integer" },
          },
        "additionalProperties": false,
      }
    "IntelligenceRender":
      {
        "type": "object",
        "required": ["question_id"],
        "properties":
          {
            "question_id": { "type": "string" },
            "png": { "type": "string" },
            "error": { "type": "string" },
          },
        "additionalProperties": false,
      }
    "IntelligenceItem":
      {
        "type": "object",
        "required":
          ["question", "model", "status", "output", "reason", "duration_ms"],
        "properties":
          {
            "question": { "$ref": "#/components/schemas/IntelligenceQuestion" },
            "model": { "type": "string" },
            "status": { "type": "string" },
            "output": { "type": "string" },
            "reason": { "type": "string" },
            "duration_ms": { "type": "integer" },
            "started_at": { "type": "string", "format": "date-time" },
            "png": { "type": "string" },
            "judge_output": { "type": "string" },
          },
        "additionalProperties": false,
      }
    "IntelligenceRun":
      {
        "type": "object",
        "required":
          [
            "id",
            "service_id",
            "started_at",
            "status",
            "items",
            "judge_service_id",
            "judge_model",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "service_id": { "type": "string" },
            "started_at": { "type": "string", "format": "date-time" },
            "status": { "type": "string" },
            "items":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/IntelligenceItem" },
              },
            "judge_service_id": { "type": "string" },
            "judge_model": { "type": "string" },
          },
        "additionalProperties": false,
      }
    PricingStatus:
      type: object
      required:
        [source, version, updated_at, checked_at, error, models, warnings]
      properties:
        source: { type: string }
        version: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
        checked_at: { type: [string, "null"], format: date-time }
        error: { type: string }
        models: { type: integer, minimum: 0 }
        warnings: { type: array, items: { type: string } }
      additionalProperties: false
    OfficialPrice:
      type: object
      required: [provider, model, name, expression]
      properties:
        provider:
          {
            type: string,
            description: Canonical first-party supplier ID; plan and regional catalogs are excluded.,
          }
        model: { type: string }
        name: { type: string }
        expression:
          {
            type: string,
            description: Restricted tiered expression with USD per million token coefficients.,
          }
      additionalProperties: false
    PriceCatalog:
      type: object
      required: [version, generated_at, activated_at, etag, prices, warnings]
      properties:
        version: { type: string }
        generated_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        etag: { type: string }
        prices:
          { type: array, items: { $ref: "#/components/schemas/OfficialPrice" } }
        warnings: { type: array, items: { type: string } }
      additionalProperties: false
    PricingConfig:
      type: object
      required: [provider, bindings, monthly_budget_usd, billing_day, time_zone]
      properties:
        provider:
          {
            type: string,
            description: Canonical first-party supplier ID; plan and regional catalogs are excluded.,
          }
        bindings:
          type: object
          additionalProperties:
            type: object
            required: [provider, model]
            properties:
              provider:
                {
                  type: string,
                  description: Canonical first-party supplier ID; plan and regional catalogs are excluded.,
                }
              model: { type: string, minLength: 1, maxLength: 256 }
            additionalProperties: false
        monthly_budget_usd:
          {
            type: string,
            description: Decimal USD reference budget; empty disables the budget.,
          }
        billing_day: { type: integer, minimum: 1, maximum: 31 }
        time_zone:
          { type: string, description: IANA calendar billing time zone. }
      additionalProperties: false
    BillingAmounts:
      type: object
      required: [amount_usd, priced, unpriced, pending, revalued, requests]
      properties:
        amount_usd: { type: string, pattern: '^[0-9]+\.[0-9]{9}$' }
        priced: { type: integer, minimum: 0 }
        unpriced: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        revalued: { type: integer, minimum: 0 }
        requests:
          {
            type: integer,
            minimum: 0,
            description: Distinct logical root requests; attempts are deduplicated separately.,
          }
    BillingTokenGroup:
      allOf:
        - { $ref: "#/components/schemas/BillingAmounts" }
        - type: object
          required: [token_id]
          properties:
            token_id:
              $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
    BillingSummary:
      allOf:
        - { $ref: "#/components/schemas/BillingAmounts" }
        - type: object
          required: [from, to, by_model, by_token]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            by_model:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/BillingAmounts" }
                  - type: object
                    required: [model, provider]
                    properties:
                      model: { type: string }
                      provider: { type: string }
            by_token:
              type: array
              items:
                $ref: "#/components/schemas/BillingTokenGroup"
    BillingPeriod:
      type: object
      required:
        [
          id,
          kind,
          start,
          end,
          observed_at,
          used_percent,
          budget_usd,
          remaining_usd,
          coverage,
          summary,
        ]
      properties:
        id: { type: string }
        kind: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        observed_at: { type: [string, "null"], format: date-time }
        used_percent: { type: [number, "null"], minimum: 0 }
        budget_usd: { type: string }
        remaining_usd:
          {
            type: string,
            description: May be negative on overrun; provisional while calls are unpriced or pending.,
          }
        coverage: { type: string, enum: [partial, observed, recorded] }
        summary: { $ref: "#/components/schemas/BillingSummary" }
      additionalProperties: false
    ServiceBilling:
      type: object
      required: [config, periods]
      properties:
        config: { $ref: "#/components/schemas/PricingConfig" }
        periods:
          { type: array, items: { $ref: "#/components/schemas/BillingPeriod" } }
      additionalProperties: false
    BillingBackfill:
      type: object
      required: [processed]
      properties:
        processed: { type: integer, minimum: 0 }
      additionalProperties: false
    ReadyEvent:
      type: object
      required:
        - event
        - core_version
        - control_api_version
        - protocol_contract_version
        - inference_url
        - control_url
      properties:
        event:
          type: string
          const: ready
        core_version:
          type: string
          minLength: 1
          maxLength: 64
        control_api_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        protocol_contract_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        inference_url:
          type: string
          format: uri
          pattern: "^http://127\\.0\\.0\\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?![\\s\\S])"
        control_url:
          type: string
          format: uri
          pattern: "^http://127\\.0\\.0\\.1:(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?![\\s\\S])"
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, starting]
      additionalProperties: false
    UsageTotals:
      type: object
      required:
        [
          requests,
          failed_requests,
          input_tokens,
          output_tokens,
          total_tokens,
          cache_read_tokens,
          cache_write_tokens,
        ]
      properties:
        requests: { type: integer, minimum: 0 }
        failed_requests: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cache_read_tokens: { type: integer, minimum: 0 }
        cache_write_tokens: { type: integer, minimum: 0 }
    UsageDayBucket:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
      unevaluatedProperties: false
    UsageHourBucket:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [date, hour]
          properties:
            date: { type: string, format: date }
            hour: { type: integer, minimum: 0, maximum: 23 }
      unevaluatedProperties: false
    UsageGroup:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [id]
          properties:
            id: { type: [string, "null"] }
      unevaluatedProperties: false
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        [
          totals,
          by_day,
          by_hour,
          by_service,
          by_model,
          by_token,
          scanned_records,
        ]
      properties:
        totals:
          $ref: "#/components/schemas/UsageTotals"
          unevaluatedProperties: false
        by_day:
          type: array
          items: { $ref: "#/components/schemas/UsageDayBucket" }
        by_hour:
          type: array
          items: { $ref: "#/components/schemas/UsageHourBucket" }
        by_service:
          type: array
          items: { $ref: "#/components/schemas/UsageGroup" }
        by_model:
          type: array
          items: { $ref: "#/components/schemas/UsageGroup" }
        by_token:
          type: array
          items: { $ref: "#/components/schemas/UsageGroup" }
        scanned_records: { type: integer, minimum: 0 }
    AccessTokenUsageResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [token_id, today_tokens, total_tokens]
            properties:
              token_id:
                $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
              today_tokens:
                type: integer
                format: int64
                minimum: 0
              total_tokens:
                type: integer
                format: int64
                minimum: 0
    AccessToken:
      type: object
      required: [id, name, hint, created_at]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 64
        hint:
          type: string
          minLength: 1
          maxLength: 32
          description: Non-secret display hint that cannot be used to authenticate.
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    AccessTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    AccessTokenSecret:
      type: object
      required: [token, access_token]
      properties:
        token:
          $ref: "#/components/schemas/AccessToken"
        access_token:
          type: string
          minLength: 48
          maxLength: 48
          pattern: "^astr_[A-Za-z0-9_-]{43}$"
      additionalProperties: false
    AccessTokenList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccessToken"
        next_cursor:
          type: "null"
          description: Reserved for a future paginated contract; v1 currently returns the complete bounded list.
      additionalProperties: false
    AccessTokenReveal:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          minLength: 48
          maxLength: 48
          pattern: "^astr_[A-Za-z0-9_-]{43}$"
      additionalProperties: false
    Version:
      type: object
      required:
        - core_version
        - control_api_version
        - protocol_contract_version
        - build_commit
      properties:
        core_version:
          type: string
          minLength: 1
          maxLength: 64
        control_api_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        protocol_contract_version:
          $ref: ./protocol-capabilities.schema.json#/$defs/ContractVersion
        build_commit:
          type: string
          minLength: 7
          maxLength: 64
          pattern: "^(?:[0-9a-f]{7,64}|unknown)$"
      additionalProperties: false
    FailureAction:
      type: string
      enum: [stop, retry, failover, retry_and_failover]
      description: Applies only to replayable requests before client response commitment. Retry and switching permissions are further bounded by the route and request budget.
    RecoveryPathNode:
      type: object
      required: [id, service_id, upstream_protocol, plan_type]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        upstream_protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        plan_type:
          $ref: ./protocol-capabilities.schema.json#/$defs/PlanType
        upstream_model:
          type: string
          maxLength: 256
          description: Empty or omitted preserves the requested model.
        max_retries:
          type: integer
          minimum: 0
          maximum: 5
          description: Automatic targets only; omission inherits the effective policy.
      additionalProperties: false
    RecoveryPath:
      type: object
      required: [id, name, protocol, mode]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        mode:
          type: string
          enum: [automatic, steps]
        targets:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/RecoveryPathNode"
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecoveryPathNode"
          description: Same execution target may appear at most six times; node IDs remain unique.
        strategy:
          type: string
          enum: [retry_first, failover_first, failover_only]
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
        failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
      oneOf:
        - properties:
            mode: { const: automatic }
          required: [targets]
          not:
            required: [steps]
        - properties:
            mode: { const: steps }
            steps:
              items:
                not:
                  required: [max_retries]
          required: [steps]
          not:
            anyOf:
              - required: [targets]
              - required: [strategy]
      additionalProperties: false
    RecoveryPathCreate:
      type: object
      required: [name, protocol, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        mode:
          type: string
          enum: [automatic, steps]
        targets:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/RecoveryPathNode"
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecoveryPathNode"
          description: Same execution target may appear at most six times; node IDs remain unique.
        strategy:
          type: string
          enum: [retry_first, failover_first, failover_only]
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
        failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
      oneOf:
        - properties:
            mode: { const: automatic }
          required: [targets]
          not:
            required: [steps]
        - properties:
            mode: { const: steps }
            steps:
              items:
                not:
                  required: [max_retries]
          required: [steps]
          not:
            anyOf:
              - required: [targets]
              - required: [strategy]
      additionalProperties: false
    RecoveryPathPatch:
      type: object
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/RecoveryPath/properties/name"
        protocol:
          $ref: "#/components/schemas/RecoveryPath/properties/protocol"
        mode:
          $ref: "#/components/schemas/RecoveryPath/properties/mode"
        targets:
          oneOf:
            - $ref: "#/components/schemas/RecoveryPath/properties/targets"
            - type: "null"
        steps:
          oneOf:
            - $ref: "#/components/schemas/RecoveryPath/properties/steps"
            - type: "null"
        strategy:
          oneOf:
            - $ref: "#/components/schemas/RecoveryPath/properties/strategy"
            - type: "null"
        max_attempts:
          oneOf:
            - $ref: "#/components/schemas/RecoveryPath/properties/max_attempts"
            - type: "null"
        failure_policy:
          oneOf:
            - $ref: "#/components/schemas/RecoveryPath/properties/failure_policy"
            - type: "null"
      additionalProperties: false
    RecoveryPathRecord:
      type: object
      required: [path, etag, references]
      properties:
        path:
          $ref: "#/components/schemas/RecoveryPath"
        etag:
          type: string
          pattern: '^"sha256:[0-9a-f]{64}"$'
        references:
          type: array
          items:
            type: object
            required: [name, protocol, override]
            properties:
              route_id:
                $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
              name: { type: string, maxLength: 128 }
              protocol:
                $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
              category_id: { type: string, maxLength: 64 }
              override: { type: boolean }
            additionalProperties: false
      additionalProperties: false
    RecoveryPreviewInput:
      type: object
      required: [path, streaming, error]
      properties:
        path:
          $ref: "#/components/schemas/RecoveryPath"
        model: { type: string, maxLength: 256 }
        streaming: { type: boolean }
        error:
          type: string
          pattern: "^(network_error|response_timeout|[45][0-9]{2})$"
        success_at: { type: integer, minimum: 0, maximum: 20 }
        retry_after: { type: string, maxLength: 128 }
        route_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        category_id: { type: string, maxLength: 64 }
      additionalProperties: false
    RecoveryPreview:
      type: object
      required: [steps, stop_reason, max_attempts]
      properties:
        stop_reason: { type: string, maxLength: 128 }
        max_attempts: { type: integer, minimum: 1, maximum: 20 }
        steps:
          type: array
          items:
            type: object
            required:
              [
                step_id,
                service_id,
                model,
                action,
                status,
                wait_min_ms,
                wait_max_ms,
              ]
            properties:
              step_id:
                $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
              service_id:
                $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
              model: { type: string, maxLength: 256 }
              action: { type: string, enum: [initial, retry, failover] }
              status: { type: string, enum: [failed, succeeded, skipped] }
              reason: { type: string, maxLength: 128 }
              wait_min_ms: { type: integer, minimum: 0 }
              wait_max_ms: { type: integer, minimum: 0 }
            additionalProperties: false
      additionalProperties: false
    FailurePolicy:
      type: object
      required:
        [
          max_retries,
          initial_delay_ms,
          max_delay_ms,
          network_error,
          response_timeout,
          http_status,
        ]
      properties:
        max_retries:
          type: integer
          description: Ordinary retries per target, excluding the first request and independent request repairs. Zero does not disable repair.
          minimum: 0
          maximum: 5
          default: 1
        initial_delay_ms:
          type: integer
          minimum: 0
          maximum: 60000
          default: 500
        max_delay_ms:
          type: integer
          minimum: 0
          maximum: 60000
          default: 5000
          description: Must be at least initial_delay_ms. A longer Retry-After prevents retrying this target and permits switching only if the error rule allows it.
        response_start_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Omission uses the global timeout. Zero is unlimited. Never imposes a deadline on a started stream.
        thinking_signature_recovery:
          type: boolean
          default: true
          description: On a recognized Claude Messages thinking signature HTTP 400, repair assistant history and resend immediately to the same target. All request repairs share one repair per target, independent of failover strategy, max_retries, backoff and HTTP error rules, but count toward max_attempts. Manual paths repair within the current step without consuming a later step. Failed repairs follow ordinary error rules. Omission enables recovery; false disables it.
        openai_reasoning_recovery:
          type: boolean
          default: true
          description: On a recognized OpenAI Responses or Responses Compact reasoning HTTP 400, repair rejected reasoning ciphertext or identified item fields and resend immediately to the same target. Preserves summaries, tool pairs, previous_response_id and compaction context. All request repairs share one repair per target, independent of failover strategy, max_retries, backoff and HTTP error rules, but count toward max_attempts. Manual paths repair within the current step without consuming a later step. Failed repairs follow ordinary error rules. Omission enables recovery; false disables it.
        openai_function_output_recovery:
          type: boolean
          default: false
          description: Opt-in. On a recognized OpenAI Responses or Responses Compact HTTP 400 for encrypted function or custom-tool output, drop encrypted output parts, keep plaintext, and resend immediately to the same target. Shares one repair per target with reasoning repair and can clear both in the same attempt. Tool call_id pairs and compaction stay intact. Independent of failover strategy, max_retries, backoff and HTTP error rules, but counts toward max_attempts. Manual paths repair within the current step. Failed repairs follow ordinary error rules. Omission disables recovery; true enables it.
        network_error:
          $ref: "#/components/schemas/FailureAction"
        response_timeout:
          $ref: "#/components/schemas/FailureAction"
        http_status:
          type: object
          propertyNames:
            pattern: "^[45][0-9]{2}$"
          additionalProperties:
            $ref: "#/components/schemas/FailureAction"
          description: Controls ordinary retries and switching after any enabled request repair. Unlisted statuses stop. Request repair is independent of HTTP status rules. Defaults permit retry and switching for 408, 429, 500, 502, 503, 504, 529; 401 and 403 permit switching only.
      additionalProperties: false
      description: A complete policy. Missing service policy inherits RoutingSettings.default_failure_policy; missing route policy uses each service policy (or the global policy). A route override replaces the entire inherited policy. Missing route failover inherits global strategy and max_attempts with switching enabled.
    FailoverPolicy:
      type: object
      required: [enabled, strategy, max_attempts]
      properties:
        enabled:
          type: boolean
          default: true
        strategy:
          type: string
          enum: [retry_first, failover_first, failover_only]
          default: retry_first
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 6
          description: Total actual upstream inference requests, including the first request, ordinary retries, request repairs and backups.
      additionalProperties: false
    ServiceOrder:
      type: object
      additionalProperties: false
      required: [service_ids]
      properties:
        service_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_-]{2,95}$"
    ChannelStickiness:
      type: object
      additionalProperties: false
      required: [enabled, ttl_seconds]
      properties:
        enabled: { type: boolean, default: true }
        ttl_seconds:
          { type: integer, minimum: 60, maximum: 86400, default: 3600 }
    ModelRedirect:
      type: object
      additionalProperties: false
      required: [from, to, enabled]
      description: Routes a client-requested model to another model before service selection. Matching is exact and case-sensitive, only enabled rules apply, and a redirect is a single hop. Responses keep the client's model name.
      properties:
        from:
          type: string
          minLength: 1
          maxLength: 256
          description: Model name sent by the client. Must be unique in the table, must not be another rule's target, and has no leading or trailing whitespace or control characters. astrlink/auto is allowed so clients still configured with the retired model can be redirected.
        to:
          type: string
          minLength: 1
          maxLength: 256
          description: Model used for routing and sent upstream. Must differ from from, must not be astrlink/auto, and must not be the source of any rule.
        enabled:
          type: boolean
    ChannelBindingScope:
      type: object
      required: [session_id, local_access_token_id, protocol, model]
      properties:
        session_id: { type: string }
        local_access_token_id: { type: string }
        protocol: { type: string }
        model: { type: string }
    ChannelBinding:
      allOf:
        - $ref: "#/components/schemas/ChannelBindingScope"
        - type: object
          required: [service_id, source, request_id, updated_at, expires_at]
          properties:
            service_id: { type: string }
            source:
              { type: string, enum: [new, explicit, echo_id, fingerprint] }
            request_id: { type: string }
            updated_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
    ChannelBindingEvent:
      allOf:
        - $ref: "#/components/schemas/ChannelBindingScope"
        - type: object
          required:
            [
              id,
              at,
              action,
              reason,
              source,
              service_id,
              previous_service_id,
              request_id,
            ]
          properties:
            id: { type: integer, minimum: 1 }
            at: { type: string, format: date-time }
            action:
              {
                type: string,
                enum: [hit, miss, strict, bound, switched, released],
              }
            reason: { type: string }
            source: { type: string }
            service_id: { type: string }
            previous_service_id: { type: string }
            request_id: { type: string }
    ChannelBindingAudit:
      type: object
      additionalProperties: false
      required: [enabled, bindings, events, has_more]
      properties:
        enabled: { type: boolean }
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/ChannelBinding"
        events:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ChannelBindingEvent"
        has_more: { type: boolean }
    RoutingSettings:
      type: object
      required:
        [
          model_redirects,
          allow_unmatched_failover,
          strategy,
          max_attempts,
          default_failure_policy,
        ]
      properties:
        codex_identity_enforcement:
          type: boolean
          default: true
          description: Use one consistent Codex upstream identity. Changes apply to new requests without a gateway restart.
        claude_identity_enforcement:
          type: boolean
          default: true
          description: Use the default Claude client identity. When disabled, preserve recognized Claude client identities.
        grok_identity_enforcement:
          type: boolean
          default: true
          description: Use the default Grok client identity. When disabled, preserve recognized Grok client identities with a matching version header.
        model_redirects:
          type: array
          maxItems: 200
          default: []
          description: Model redirect table applied to new inference requests before service selection. Always present; empty when no rules exist.
          items:
            $ref: "#/components/schemas/ModelRedirect"
        channel_stickiness:
          $ref: "#/components/schemas/ChannelStickiness"
        default_recovery_paths:
          type: object
          additionalProperties:
            $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        default_failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
        allow_unmatched_failover:
          type: boolean
          default: true
        strategy:
          type: string
          enum: [retry_first, failover_first, failover_only]
          default: retry_first
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 6
      additionalProperties: false
    RoutingSettingsPatch:
      type: object
      minProperties: 1
      properties:
        codex_identity_enforcement:
          type: boolean
        claude_identity_enforcement:
          type: boolean
        grok_identity_enforcement:
          type: boolean
        model_redirects:
          type: array
          maxItems: 200
          description: Replaces the whole redirect table. Send an empty array to remove every rule; null is rejected.
          items:
            $ref: "#/components/schemas/ModelRedirect"
        channel_stickiness:
          $ref: "#/components/schemas/ChannelStickiness"
        default_recovery_paths:
          type: object
          additionalProperties:
            $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        default_failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
        allow_unmatched_failover:
          type: boolean
        strategy:
          type: string
          enum: [retry_first, failover_first, failover_only]
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
      additionalProperties: false
    RequestRecovery:
      type: object
      required: [delay_ms]
      properties:
        path_id: { type: string, maxLength: 128 }
        path_name: { type: string, maxLength: 128 }
        path_version: { type: string, maxLength: 128 }
        step_id: { type: string, maxLength: 128 }
        upstream_model:
          type: string
          maxLength: 256
          description: Actual model used by this attempt. Privileged local metadata; never injected into public inference errors.
        action:
          type: string
          enum: [retry, failover]
        reason:
          type: string
          maxLength: 128
        delay_ms:
          type: integer
          minimum: 0
          maximum: 60000
        stop_reason:
          type: string
          maxLength: 128
      additionalProperties: false
    ServiceKind:
      type: string
      enum:
        - codex_subscription
        - claude_subscription
        - grok_subscription
        - opencode_go
        - opencode_zen
        - kimi_coding
        - glm_coding
        - minimax_coding
        - deepseek
        - qwen
        - moonshot
        - glm
        - minimax
        - doubao
        - xai
        - newapi
        - openai
        - anthropic
        - gemini
        - openai_compatible
        - custom
      description: >
        Product-level service type. Codex, Claude and Grok subscriptions use OAuth.
        Coding plans and other HTTP services use provider-issued API keys.
    HTTPServiceConnection:
      type: object
      required: [base_url, auth]
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://[^?#]+$"
          not:
            pattern: "^https?://[^/]*@"
          description: HTTP(S) origin or reverse-proxy path prefix without userinfo, query, or fragment.
        auth:
          $ref: ./protocol-capabilities.schema.json#/$defs/ServiceAuth
        credential_ref:
          type: string
          pattern: "^local://service/[a-z][a-z0-9_-]{2,95}$"
          readOnly: true
          description: Opaque local credential reference; never contains credential bytes.
      additionalProperties: false
    SubscriptionServiceConnection:
      type: object
      required: [provider, status]
      properties:
        provider:
          type: string
          enum: [openai_codex, claude_code, xai_grok]
        status:
          type: string
          enum: [disconnected, authorizing, connected, needs_reauth, error]
        account_hint:
          type: string
          maxLength: 128
        provider_account_id:
          type: string
          maxLength: 256
        credential_ref:
          type: string
          maxLength: 512
          pattern: "^keyring://"
          readOnly: true
          description: Opaque keyring reference; OAuth token bytes never cross the control API.
        authorization_boundary:
          type: string
          maxLength: 240
        token_expires_at:
          type: string
          format: date-time
        last_refresh_at:
          type: string
          format: date-time
        last_error:
          $ref: "#/components/schemas/SubscriptionError"
      additionalProperties: false
    ServiceProxy:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [inherit, direct, custom]
        url:
          type: string
          maxLength: 2048
          description: HTTP, HTTPS or SOCKS5 proxy URL, without userinfo, query or fragment. Required in custom mode only.
        credential_ref:
          type: string
          readOnly: true
          description: Local proxy credential reference; never contains authentication bytes.
      additionalProperties: false
      allOf:
        - if:
            properties:
              mode: { const: custom }
          then:
            required: [url]
          else:
            not:
              anyOf:
                - required: [url]
                - required: [credential_ref]
    ServiceProxyInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [inherit, direct, custom]
        url:
          type: string
          maxLength: 2048
          description: HTTP, HTTPS or SOCKS5 proxy URL without embedded credentials; required for custom mode.
        credential:
          oneOf:
            - type: object
              required: [username, password]
              properties:
                username:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 255,
                    writeOnly: true,
                  }
                password: { type: string, maxLength: 255, writeOnly: true }
              additionalProperties: false
            - type: "null"
          writeOnly: true
          description: Omit to keep saved authentication; null clears it. Authentication requires custom mode. Credentials are limited to 255 UTF-8 bytes each.
      additionalProperties: false
      allOf:
        - if:
            properties:
              mode: { const: custom }
          then:
            required: [url]
          else:
            not:
              required: [url]
            properties:
              credential: { type: "null" }
    Service:
      type: object
      required:
        [id, name, kind, enabled, models, capabilities, created_at, updated_at]
      properties:
        proxy:
          $ref: "#/components/schemas/ServiceProxy"
        responses_websocket_enabled:
          type: boolean
          description: Per-channel native Responses WebSocket switch. When omitted, defaults to true for codex_subscription and false for other providers. Explicit false overrides the Codex default.
        failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: "#/components/schemas/ServiceKind"
        enabled:
          type: boolean
        models:
          $ref: "#/components/schemas/ServiceModels"
        capabilities:
          type: array
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ServiceCapability
        http:
          $ref: "#/components/schemas/HTTPServiceConnection"
        subscription:
          $ref: "#/components/schemas/SubscriptionServiceConnection"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
      oneOf:
        - properties:
            kind:
              enum: [codex_subscription, claude_subscription, grok_subscription]
          required: [subscription]
          not:
            required: [http]
        - properties:
            kind:
              $ref: ./protocol-capabilities.schema.json#/$defs/HTTPServiceKind
          required: [http]
          not:
            required: [subscription]
    HTTPServiceConnectionInput:
      type: object
      required: [base_url, auth]
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://[^?#]+$"
          not:
            pattern: "^https?://[^/]*@"
        auth:
          $ref: ./protocol-capabilities.schema.json#/$defs/ServiceAuth
        credential:
          $ref: "#/components/schemas/CredentialInput"
      additionalProperties: false
    ServiceCreate:
      type: object
      required: [name, kind]
      properties:
        proxy:
          oneOf:
            - $ref: "#/components/schemas/ServiceProxyInput"
            - type: "null"
          description: Omit to retain the saved proxy; null inherits the global network policy.
        responses_websocket_enabled:
          type: boolean
          description: Per-channel native Responses WebSocket switch. When omitted, defaults to true for codex_subscription and false for other providers. Explicit false overrides the Codex default.
        failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: "#/components/schemas/ServiceKind"
        enabled:
          type: boolean
          default: true
        models:
          $ref: "#/components/schemas/ServiceModels"
        http:
          $ref: "#/components/schemas/HTTPServiceConnectionInput"
        capabilities:
          type: array
          description: Required for HTTP services. Subscription services default to the provider's fixed native capabilities; when supplied, the list must keep those unchanged and may only add native-mode local conversions whose convert_to is a protocol the provider serves (openai.responses for Codex, anthropic.messages for Claude, openai.responses or openai.chat for Grok).
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ServiceCapability
      additionalProperties: false
      oneOf:
        - properties:
            kind:
              enum: [codex_subscription, claude_subscription, grok_subscription]
          not:
            required: [http]
        - properties:
            kind:
              $ref: ./protocol-capabilities.schema.json#/$defs/HTTPServiceKind
          required: [http, capabilities]
    HTTPServiceConnectionPatch:
      type: object
      minProperties: 1
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://[^?#]+$"
          not:
            pattern: "^https?://[^/]*@"
        auth:
          $ref: ./protocol-capabilities.schema.json#/$defs/ServiceAuth
        credential:
          oneOf:
            - $ref: "#/components/schemas/CredentialInput"
            - type: "null"
              description: Remove the stored HTTP credential.
      additionalProperties: false
    ServicePatch:
      type: object
      minProperties: 1
      properties:
        proxy:
          oneOf:
            - $ref: "#/components/schemas/ServiceProxyInput"
            - type: "null"
          description: Omit to retain the saved proxy; null inherits the global network policy.
        responses_websocket_enabled:
          type: boolean
          description: Per-channel native Responses WebSocket switch. When omitted, defaults to true for codex_subscription and false for other providers. Explicit false overrides the Codex default.
        failure_policy:
          oneOf:
            - $ref: "#/components/schemas/FailurePolicy"
            - type: "null"
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        models:
          $ref: "#/components/schemas/ServiceModels"
        http:
          $ref: "#/components/schemas/HTTPServiceConnectionPatch"
        capabilities:
          type: array
          description: Replaces the capability list. Subscription services must keep the provider's fixed native capabilities and may only add local conversions into a protocol the provider serves.
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ServiceCapability
      additionalProperties: false
    CredentialInput:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Stored through CredentialStore and never returned or logged.
      additionalProperties: false
    ServiceModels:
      type: array
      maxItems: 2000
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 256
      default: []
      description: Exact service-wide model allow-list. An empty list makes the service unavailable for inference routing.
    DraftServiceModelProbe:
      type: object
      required: [kind, http, protocol]
      properties:
        proxy:
          oneOf:
            - $ref: "#/components/schemas/ServiceProxyInput"
            - type: "null"
          description: Omit to retain the saved proxy; null inherits the global network policy.
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        kind:
          $ref: ./protocol-capabilities.schema.json#/$defs/HTTPServiceKind
        http:
          $ref: "#/components/schemas/HTTPServiceConnectionInput"
        protocol:
          type: string
          enum: [openai.models, google.models]
      additionalProperties: false
    AstrLinkAutoModel:
      type: string
      const: astrlink/auto
      description: >
        Reserved public virtual-model identifier. It is never an ordinary
        alias: requests using this exact model require a Route whose
        selection.mode is auto.
    RouteSelectionMode:
      type: string
      enum: [priority, auto]
      description: >
        priority chooses targets in deterministic target-priority order. auto
        applies hard capability constraints, classifies the bounded request into
        one category in a versioned taxonomy, keeps the targets configured under
        that category_id, and then uses target priority as the deterministic
        selection and fallback order. The classifier never predicts a target or
        upstream model identifier.
    RouteSelection:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/RouteSelectionMode"
        taxonomy_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9._-]{0,63}$"
          example: astrlink-text-v1
          description: >
            Versioned task-classification taxonomy used by auto selection.
            Required when mode is auto and forbidden when mode is priority.
            It identifies label semantics, not a classifier implementation.
      allOf:
        - if:
            properties:
              mode:
                const: auto
            required: [mode]
          then:
            required: [taxonomy_id]
          else:
            not:
              required: [taxonomy_id]
      additionalProperties: false
      description: >
        Optional target-selection strategy. Omission is exactly equivalent to
        mode priority, preserving existing Route behavior. Mode auto requires
        match.model to equal astrlink/auto and replaces the ordinary top-level
        targets array with at least two RouteCategory objects. Every category
        owns one or more targets, every target has a concrete upstream_model,
        and the complete Route contains at least two distinct upstream model
        names. The taxonomy ID and category-owned model pools are stable
        configuration; classifier weights, confidence values, and model-ranking
        predictions are not.
    Route:
      type: object
      required:
        - id
        - name
        - enabled
        - priority
        - match
      properties:
        recovery_path_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
        failover:
          $ref: "#/components/schemas/FailoverPolicy"
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        match:
          $ref: "#/components/schemas/RouteMatch"
        selection:
          $ref: "#/components/schemas/RouteSelection"
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTarget"
        categories:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RouteCategory"
      allOf:
        - if:
            properties:
              selection:
                properties:
                  mode:
                    const: auto
                required: [mode]
            required: [selection]
          then:
            required: [categories]
            properties:
              match:
                properties:
                  model:
                    $ref: "#/components/schemas/AstrLinkAutoModel"
                required: [model]
            not:
              anyOf:
                - required: [targets]
                - required: [recovery_path_id]
          else:
            oneOf:
              - required: [targets]
              - required: [recovery_path_id]
            properties:
              match:
                not:
                  properties:
                    model:
                      $ref: "#/components/schemas/AstrLinkAutoModel"
                  required: [model]
            not:
              required: [categories]
      additionalProperties: false
    RouteCreate:
      type: object
      required: [name, priority, match]
      properties:
        recovery_path_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        failure_policy:
          $ref: "#/components/schemas/FailurePolicy"
        failover:
          $ref: "#/components/schemas/FailoverPolicy"
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        match:
          $ref: "#/components/schemas/RouteMatch"
        selection:
          $ref: "#/components/schemas/RouteSelection"
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTarget"
        categories:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/RouteCategory"
      allOf:
        - if:
            properties:
              selection:
                properties:
                  mode:
                    const: auto
                required: [mode]
            required: [selection]
          then:
            required: [categories]
            properties:
              match:
                properties:
                  model:
                    $ref: "#/components/schemas/AstrLinkAutoModel"
                required: [model]
            not:
              anyOf:
                - required: [targets]
                - required: [recovery_path_id]
          else:
            oneOf:
              - required: [targets]
              - required: [recovery_path_id]
            properties:
              match:
                not:
                  properties:
                    model:
                      $ref: "#/components/schemas/AstrLinkAutoModel"
                  required: [model]
            not:
              required: [categories]
      additionalProperties: false
    RoutePatch:
      type: object
      minProperties: 1
      properties:
        recovery_path_id:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
            - type: "null"
        failure_policy:
          oneOf:
            - $ref: "#/components/schemas/FailurePolicy"
            - type: "null"
        failover:
          oneOf:
            - $ref: "#/components/schemas/FailoverPolicy"
            - type: "null"
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        match:
          $ref: "#/components/schemas/RouteMatch"
        selection:
          oneOf:
            - $ref: "#/components/schemas/RouteSelection"
            - type: "null"
              description: Restore the backward-compatible priority selection mode.
        targets:
          oneOf:
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/RouteTarget"
            - type: "null"
              description: Remove top-level priority targets when switching to auto.
        categories:
          oneOf:
            - type: array
              minItems: 2
              items:
                $ref: "#/components/schemas/RouteCategory"
            - type: "null"
              description: Remove category pools when switching to priority.
          description: >
            After applying a merge patch, the resulting Route must satisfy the
            priority/auto conditional shape and full cross-field validation.
      additionalProperties: false
    RouteMatch:
      type: object
      required: [protocol]
      properties:
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        model:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            Exact public model or alias. Omission matches any model.
            astrlink/auto is reserved and is valid only with
            selection.mode=auto.
      additionalProperties: false
    RouteTarget:
      type: object
      required:
        - service_id
        - plan_type
        - upstream_protocol
        - priority
      properties:
        service_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        plan_type:
          $ref: ./protocol-capabilities.schema.json#/$defs/PlanType
          description: RelayKit is a stable future value but is rejected while capabilities report it unavailable in Alpha.
        upstream_protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        upstream_model:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            Rewrite the public model to this upstream model for this target.
            Requires a non-empty match.model on the route. Omission preserves
            the public model bytes. Every auto-selection target requires this
            field; target priority remains its deterministic low-confidence and
            transport-failure fallback order.
      additionalProperties: false
    RouteCategory:
      type: object
      required: [category_id]
      oneOf:
        - required: [targets]
        - required: [recovery_path_id]
      properties:
        recovery_path_id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        category_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9._-]{0,63}$"
          description: >
            One classifier output from selection.taxonomy_id. Category IDs are
            supplied by AstrLink's versioned taxonomy, not inferred from model
            names.
        targets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteTarget"
          description: >
            Ordered concrete model candidates configured under this category.
            Multiple models are allowed and target priority determines the
            category-local selection and transport-fallback order. The same
            concrete model may appear in another category explicitly.
      additionalProperties: false
    Policy:
      type: object
      required:
        - id
        - name
        - enabled
        - priority
        - detector
        - local_model_id
        - min_confidence
        - regex_source
        - custom_regex_rules
        - kind_rules
        - allowlist_rules
        - match
        - request_action
        - response_action
        - response_restore
        - restore_tool_arguments
        - placeholder_notice
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        detector:
          $ref: "#/components/schemas/PolicyDetector"
        local_model_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelInstallationId"
            - type: "null"
          description: Required to reference a ready installation when detector is local_model; null for regex.
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
          description: >
            Inclusive confidence threshold for local-model findings. Candidates
            below this value are suppressed before the request action is chosen.
            Regex findings do not use this threshold.
        match:
          $ref: "#/components/schemas/PolicyMatch"
        request_action:
          $ref: "#/components/schemas/PolicyAction"
        response_action:
          type: string
          const: allow
          readOnly: true
        response_restore:
          type: boolean
          default: true
          description: >
            When request_action is redact, restore this request's placeholders in
            the upstream response before returning to the client. Default true.
        regex_source:
          $ref: "#/components/schemas/PolicyRegexSource"
        custom_regex_rules:
          type: array
          maxItems: 64
          default: []
          items:
            $ref: "#/components/schemas/PolicyRegexRule"
          description: >
            Persisted even when regex_source is builtin so switching modes does
            not discard edits. Applied only when detector is regex and
            regex_source is custom; replaces the built-in Regex catalog.
        kind_rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyKindRule"
          description: >
            Normalized by Core to exactly one entry per PrivacyKind, so a
            partial patch never leaves the effective shape of a kind ambiguous.
        allowlist_rules:
          type: array
          maxItems: 128
          default: []
          items:
            $ref: "#/components/schemas/PolicyAllowlistRule"
          description: >
            Matched values are exempt from redaction and reach the upstream and
            the local agent unchanged.
        restore_tool_arguments:
          type: boolean
          default: true
          description: >
            Restore placeholders inside tool and function call arguments as well
            as visible text. The tool call runs in the operator's own agent
            harness, so it needs the real value; leaving this off while any kind
            uses the natural style lets a plausible-looking stand-in be written
            to disk or fetched over the network as if it were genuine.
        placeholder_notice:
          type: boolean
          default: true
          description: >
            When a request emits at least one token-shaped placeholder, prepend a
            short note to the upstream system instruction explaining that the
            markers are opaque and must be copied verbatim. The note never
            carries the mapping. Requests that emit only natural stand-ins skip
            it, since those need no explanation.
      additionalProperties: false
    PolicyKindRule:
      type: object
      required: [kind, enabled, style]
      properties:
        kind:
          $ref: "#/components/schemas/PrivacyKind"
        enabled:
          type: boolean
        style:
          $ref: "#/components/schemas/PlaceholderStyle"
      additionalProperties: false
      description: >
        Per-kind detection switch and placeholder shape. url and ip_address ship
        disabled because they are the dominant false-positive source for coding
        agents. common_secret, private_person, private_address, and private_date
        are rejected with any style other than token.
    PlaceholderStyle:
      type: string
      enum: [natural, token]
      default: token
      description: >
        token emits an opaque marker such as <PRIVATE_EMAIL_hex>: an unrestored
        leak is obvious, but the marker is out-of-distribution text that violates
        typed tool-argument schemas. natural emits a syntactically valid stand-in
        from a permanently reserved namespace, such as an address under the
        .invalid TLD: a model copies it without instruction and schemas accept
        it, but an unrestored leak looks plausible, so it is only safe alongside
        restore_tool_arguments.
    PolicyAllowlistRule:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [literal, domain_suffix, cidr]
        value:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            An exact string for literal, a registrable suffix for domain_suffix,
            or CIDR notation for cidr. domain_suffix and cidr resolve the matched
            value to a host or address first, so one rule covers a bare host, a
            URL on that host, and an address at that domain.
      additionalProperties: false
    PrivacyKind:
      type: string
      description: Every kind a detector may emit; the local model adds the private_ kinds.
      enum:
        - common_secret
        - payment_card
        - account
        - email
        - phone
        - url
        - ip_address
        - private_person
        - private_address
        - private_date
    PolicyCreate:
      type: object
      required: [name, priority, detector, match, request_action]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        detector:
          $ref: "#/components/schemas/PolicyDetector"
        local_model_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelInstallationId"
            - type: "null"
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        match:
          $ref: "#/components/schemas/PolicyMatch"
        request_action:
          $ref: "#/components/schemas/PolicyAction"
        response_restore:
          type: boolean
          default: true
      additionalProperties: false
    PolicyPatch:
      type: object
      minProperties: 1
      properties:
        enabled:
          type: boolean
        detector:
          $ref: "#/components/schemas/PolicyDetector"
        local_model_id:
          oneOf:
            - $ref: "#/components/schemas/PrivacyModelInstallationId"
            - type: "null"
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
        regex_source:
          $ref: "#/components/schemas/PolicyRegexSource"
        custom_regex_rules:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PolicyRegexRule"
        kind_rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyKindRule"
        allowlist_rules:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/PolicyAllowlistRule"
        request_action:
          $ref: "#/components/schemas/PolicyAction"
        response_restore:
          type: boolean
        restore_tool_arguments:
          type: boolean
        placeholder_notice:
          type: boolean
      additionalProperties: false
    PolicyRegexSource:
      type: string
      enum: [builtin, custom]
      default: builtin
      description: >
        When detector is regex, builtin uses the fixed high-confidence catalog;
        custom uses only custom_regex_rules.
    PolicyRegexRule:
      type: object
      required: [kind, pattern]
      properties:
        kind:
          $ref: "#/components/schemas/PrivacyRegexDetectorKind"
        pattern:
          type: string
          minLength: 1
          maxLength: 512
          description: Go RE2 regular expression; compiled by Core on save and inspect.
      additionalProperties: false
    PolicyRegexBuiltinRulesResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRegexRule"
      additionalProperties: false
    PrivacyRegexDetectorKind:
      type: string
      enum:
        - email
        - phone
        - account
        - payment_card
        - ip_address
        - url
        - common_secret
    PolicyDryRunRequest:
      type: object
      required: [protocol, sample_text]
      properties:
        protocol:
          $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
          description: Must be a protocol with inspectable request-body roots.
        sample_text:
          type: string
          minLength: 1
          maxLength: 262144
        policy:
          $ref: "#/components/schemas/PolicyPatch"
          description: Optional patchable overrides applied only for this evaluation.
      additionalProperties: false
    PolicyDryRunFinding:
      type: object
      required: [kind, path, start, end, confidence]
      description: >
        Matched span metadata only. Never includes matched plaintext; sample
        plaintext for placeholders appears solely on redactions for local dry-run.
      properties:
        kind:
          $ref: "#/components/schemas/PrivacyCanonicalKind"
        path:
          type: string
          minLength: 1
          description: JSON Pointer path of the inspected string segment.
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Detector confidence retained from the local worker; Regex findings use 1.
        reason:
          type: string
          enum:
            - low_confidence
            - kind_disabled
            - allowlisted
            - placeholder
            - unrepresentable
          description: >
            Why the span was left in the request. Absent on accepted findings.
            placeholder means the value already belonged to a placeholder
            namespace, so redacting it again would make the innermost original
            unrecoverable. unrepresentable means the kind ran out of reserved
            stand-ins and fell back to a token placeholder.
      additionalProperties: false
    PolicyDryRunRedaction:
      type: object
      required: [placeholder, kind, value, style]
      properties:
        placeholder:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/PrivacyCanonicalKind"
        value:
          type: string
          description: Original sample text for this placeholder; dry-run only.
        style:
          $ref: "#/components/schemas/PlaceholderStyle"
          description: >
            The shape actually emitted, which falls back to token when the kind's
            reserved namespace is exhausted.
      additionalProperties: false
    PolicyDryRunResponse:
      type: object
      required:
        [
          decision,
          findings_summary,
          findings,
          suppressed_findings,
          inspected_body,
        ]
      properties:
        decision:
          $ref: "#/components/schemas/PolicyAction"
        findings_summary:
          type: string
          description: Stable kind=count summary; never includes matched plaintext.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDryRunFinding"
          description: Findings that passed the configured threshold and drive the decision.
        suppressed_findings:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDryRunFinding"
          description: >
            Detected spans that were left untouched, each carrying the reason.
            Covers disabled kinds, allowlist matches, values already inside a
            placeholder namespace, and local-model candidates below
            min_confidence.
        redactions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDryRunRedaction"
          description: Placeholder-to-sample mapping for local preview; never used on the live inference plane.
        redacted_body:
          type: string
          description: Present only when decision is redact.
        inspected_body:
          type: string
          description: Minimal request JSON that was actually inspected.
      additionalProperties: false
    PolicyMatch:
      type: object
      properties:
        protocols:
          type: array
          uniqueItems: true
          default: []
          items:
            $ref: ./protocol-capabilities.schema.json#/$defs/ProtocolId
          description: Empty means all protocols.
        models:
          type: array
          uniqueItems: true
          default: []
          items:
