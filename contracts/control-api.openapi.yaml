  /control/v1/usage-summary:
    x-astrlink-implementation-status: implemented
    get:
      tags: [Requests]
      operationId: getUsageSummary
      summary: Summarize all retained root requests in a calendar window.
      description: >-
        Returns successful request counts and tokens, failed request counts,
        and sparse calendar, service and model buckets in one response.
        Retry children, pending, blocked and cancelled requests are excluded.
        Legacy succeeded requests with HTTP errors count as failed. Service,
        model and local access-token buckets contain successful and failed request
        counts; token usage is accumulated only for successful requests. No
        pagination cap applies.
        Calendar buckets use the supplied IANA zone, including DST transitions.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive whole-second RFC3339 timestamp.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Exclusive whole-second RFC3339 timestamp, at most 366 days after from.
          schema: { type: string, format: date-time }
        - name: time_zone
          in: query
          required: true
          schema: { type: string, examples: [Asia/Tokyo] }
        - name: bucket
          in: query
          required: true
          description: Day buckets are always included; hour also includes local-hour buckets.
          schema: { type: string, enum: [day, hour] }
      responses:
        "200":
          description: Complete statistics for the retained window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
