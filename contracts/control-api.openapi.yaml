          type: boolean
        request_body_max_bytes:
          type: integer
          minimum: 1024
          maximum: 16777216
        response_content_max_bytes:
          type: integer
          minimum: 1024
          maximum: 67108864
        metadata_retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        content_retention_days:
          type: integer
          minimum: 1
          maximum: 365
        audit_risk_acknowledged:
          type: boolean
          writeOnly: true
          description: Must be true when enabling either capture switch; the acknowledgement is not persisted.
        extensions:
          oneOf:
            - $ref: ./protocol-capabilities.schema.json#/$defs/Extensions
            - type: "null"
          description: Namespaced extensions to replace, or null to delete them under RFC 7386 merge-patch semantics.
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/AuditAcknowledgementInvariant"
    AuditAcknowledgementInvariant:
      if:
        anyOf:
          - required: [request_body_enabled]
            properties:
              request_body_enabled:
                const: true
          - required: [response_content_enabled]
            properties:
              response_content_enabled:
                const: true
      then:
        required: [audit_risk_acknowledged]
        properties:
          audit_risk_acknowledged:
            const: true
    EventSeverity:
      type: string
      enum: [debug, info, warning, error, critical]
    Event:
      type: object
      required: [id, occurred_at, type, severity, summary, subject, attributes]
      properties:
        id:
          $ref: ./protocol-capabilities.schema.json#/$defs/ResourceId
        occurred_at:
          type: string
          format: date-time
        type:
          type: string
          minLength: 3
          maxLength: 96
          pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$"
          examples: [endpoint.health_changed, core.started, policy.blocked]
        severity:
          $ref: "#/components/schemas/EventSeverity"
        summary:
          type: string
          minLength: 1
          maxLength: 512
          description: Sanitized human-readable text without upstream URLs, IPs, credentials, or body content.
        subject:
          $ref: "#/components/schemas/EventSubject"
        attributes:
          $ref: "#/components/schemas/SanitizedAttributes"
      additionalProperties: false
    EventSubject:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [core, endpoint, route, policy, request]
