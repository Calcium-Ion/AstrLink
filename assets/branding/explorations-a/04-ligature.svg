<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>AstrLink - AL Ligature</title>
  <desc>An asymmetric A shares its upright with an L, ending in a short colored foot.</desc>
  <defs>
    <filter id="ligature-shadow" x="24" y="28" width="464" height="468" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#20272F" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="#303640" filter="url(#ligature-shadow)"/>
  <g id="ligature-mark" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M141 360L242 155Q250 140 266 140H284V360" stroke="#FFFFFF"/>
    <path d="M186 284H284" stroke="#FFFFFF" stroke-width="40"/>
    <path d="M284 360H370" stroke="#6BDBC7"/>
  </g>
</svg>
