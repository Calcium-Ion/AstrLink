    <image href="data:image/svg+xml;base64," x="340" y="66" width="100" height="100"/>
    <text x="390" y="190" text-anchor="middle" font-size="12" fill="#78828B">ONE INK</text>
    <image href="data:image/svg+xml;base64," x="308" y="244" width="64" height="64"/>
    <image href="data:image/svg+xml;base64," x="416" y="268" width="32" height="32"/>
    <text x="340" y="342" text-anchor="middle" font-size="12" fill="#78828B">64 PX</text>
    <text x="432" y="342" text-anchor="middle" font-size="12" fill="#78828B">32 PX</text>
    <line x1="0" y1="388" x2="488" y2="388" stroke="#E3E7E9"/>
  </g>
<g transform="translate(48 530)">
    <text x="0" y="30" font-size="16" font-weight="600" fill="#CA6258">03 / ARCH A</text>
    <image href="data:image/svg+xml;base64," x="0" y="48" width="280" height="280"/>
    <image href="data:image/svg+xml;base64," x="340" y="66" width="100" height="100"/>
    <text x="390" y="190" text-anchor="middle" font-size="12" fill="#78828B">ONE INK</text>
    <image href="data:image/svg+xml;base64," x="308" y="244" width="64" height="64"/>
    <image href="data:image/svg+xml;base64," x="416" y="268" width="32" height="32"/>
    <text x="340" y="342" text-anchor="middle" font-size="12" fill="#78828B">64 PX</text>
    <text x="432" y="342" text-anchor="middle" font-size="12" fill="#78828B">32 PX</text>
    <line x1="0" y1="388" x2="488" y2="388" stroke="#E3E7E9"/>
  </g>
<g transform="translate(592 530)">
