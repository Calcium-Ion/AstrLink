<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>AstrLink - 2D COMPACT</title>
  <desc>A refined A monogram threaded through a continuous cyan, periwinkle and rose ribbon. Variant 2D: compact loop.</desc>
  <defs>
    <linearGradient id="loop-2d-color" x1="-133" y1="0" x2="133" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20BBC7"/>
      <stop offset=".56" stop-color="#7F8FE8"/>
      <stop offset="1" stop-color="#DA7BAF"/>
    </linearGradient>
    <filter id="loop-2d-shadow" x="24" y="28" width="464" height="468" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#26345E" flood-opacity=".14"/>
    </filter>
    <path id="loop-2d-ring" d="M-133 0A133 54 0 1 1 133 0A133 54 0 1 1 -133 0Z M-110 -5A110 24 0 1 0 110 -5A110 24 0 1 0 -110 -5Z" transform="translate(256 274) rotate(-20)" fill-rule="evenodd"/>
    <path id="loop-2d-front" d="M-133 0C-133 29.823 -73.454 54 0 54C73.454 54 133 29.823 133 0L110 -5C110 8.255 60.751 19 0 19C-60.751 19 -110 8.255 -110 -5Z" transform="translate(256 274) rotate(-20)"/>
    <mask id="loop-2d-crossing" x="88" y="104" width="340" height="306" maskUnits="userSpaceOnUse">
      <rect x="88" y="104" width="340" height="306" fill="#FFFFFF"/>
      <use href="#loop-2d-front" fill="#000000" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="#F9FAFE" filter="url(#loop-2d-shadow)"/>
  <g id="loop-2d-mark">
    <use href="#loop-2d-ring" fill="url(#loop-2d-color)"/>
    <path d="M150 365L236 155Q256 117 276 155L362 365" stroke="#304074" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" mask="url(#loop-2d-crossing)"/>
    <use href="#loop-2d-front" fill="url(#loop-2d-color)"/>
  </g>
</svg>
