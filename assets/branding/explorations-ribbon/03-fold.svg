<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>AstrLink - Folded Connection</title>
  <desc>A broad ribbon folds around the two legs of an angular A, forming a connected rising crossbar.</desc>
  <defs>
    <linearGradient id="fold-ribbon-color" x1="118" y1="327" x2="396" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20BBC7"/>
      <stop offset=".55" stop-color="#7F8FE8"/>
      <stop offset="1" stop-color="#DA7BAF"/>
    </linearGradient>
    <filter id="fold-ribbon-shadow" x="24" y="28" width="464" height="468" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#26345E" flood-opacity=".14"/>
    </filter>
    <mask id="fold-crossing" x="100" y="110" width="312" height="300" maskUnits="userSpaceOnUse">
      <rect x="100" y="110" width="312" height="300" fill="#FFFFFF"/>
      <path d="M165 292C238 310 289 251 356 242" stroke="#000000" stroke-width="54" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="#F9FAFE" filter="url(#fold-ribbon-shadow)"/>
  <g id="fold-ribbon-mark">
    <path d="M165 289L121 329L130 280L165 289Z" fill="#20869A"/>
    <path d="M353 244L394 219L382 270L353 244Z" fill="#9C608E"/>
    <path d="M127 376L233 136H279L385 376H324L256 205L188 376H127Z" fill="#304074" mask="url(#fold-crossing)"/>
    <path d="M130 280C185 302 216 286 257 263C306 235 347 228 394 219L382 253C337 263 305 273 267 295C218 322 174 337 121 329L130 280Z" fill="url(#fold-ribbon-color)"/>
  </g>
</svg>
