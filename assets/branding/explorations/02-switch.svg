<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>AstrLink - Switch</title>
  <desc>A continuous route rises between two ports, with a separate branch turning down.</desc>
  <defs>
    <filter id="switch-shadow" x="24" y="28" width="464" height="468" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#122B72" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect x="52" y="52" width="408" height="408" rx="92" fill="#245BE8" filter="url(#switch-shadow)"/>
  <g id="switch-mark" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 262H282C307 262 322 277 322 302V350" stroke="#7DE6D9"/>
    <path d="M148 330H188C215 330 230 315 230 288V202C230 175 245 160 272 160H354" stroke="#FFFFFF"/>
  </g>
</svg>
